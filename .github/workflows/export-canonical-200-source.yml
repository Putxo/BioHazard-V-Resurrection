name: export-canonical-200-source
on:
  push:
    branches: [decomp/canonical-200]
    paths: [.github/workflows/export-canonical-200-source.yml]
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export committed source only
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/canonical-200-source.tar"
          sha256sum "$RUNNER_TEMP/canonical-200-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-200-source
          path: ${{ runner.temp }}/canonical-200-source.tar
          retention-days: 1
          if-no-files-found: error
