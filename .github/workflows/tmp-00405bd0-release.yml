name: tmp-00405bd0-release

on:
  push:
    branches: [release/main-fastpass83]
    paths-ignore:
      - 'README.md'
      - 'reports/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate public dashboard and validate
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
      - name: Commit generated public dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md reports/progress.md reports/functions.json reports/progress-treemap.svg
          git diff --cached --quiet || git commit -m 'Publish FAST PASS 83 dashboard'
          git push
