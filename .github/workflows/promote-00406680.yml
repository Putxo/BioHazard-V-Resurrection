name: Promote FUN_00406680 FAST_PASS_VALIDATED

on:
  push:
    branches:
      - promote/00406680-fastpass-valid

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/00406680-fastpass-valid
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote FUN_00406680 metadata only
        shell: python
        run: |
          import csv
          from pathlib import Path
          target='FUN_00406680'
          merge_sha='deb873467afe1ac8f226aff7ad064de075b80f72'
          functions=Path('database/functions.csv')
          with functions.open(newline='') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          matches=[r for r in rows if r['stable_id']==target]
          if len(matches)!=1: raise SystemExit(f'expected one {target} row, found {len(matches)}')
          row=matches[0]
          if row['fast_pass'].lower()!='true': raise SystemExit('target is not FAST_PASS')
          row['fast_pass_validated']='true'
          row['pr']='#205'
          row['commit']=merge_sha
          suffix='PR #205 CI 5/5 PASS'
          if suffix not in row['notes']:
              row['notes']=row['notes'].rstrip('; ')+'; '+suffix
          with functions.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          history=Path('database/history.csv')
          event=f'{target},2026-09-22,FAST_PASS,FAST_PASS_VALIDATED,{merge_sha},coordinator,PR #205 completed 5/5 CI checks'
          text=history.read_text(encoding='utf-8')
          if event not in text: history.write_text(text.rstrip('\n')+'\n'+event+'\n',encoding='utf-8')
      - name: Regenerate canonical reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Validate metadata and reports
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Diff hygiene and reject binary products
        shell: bash
        run: |
          git diff --check
          if git diff --name-only HEAD | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then exit 1; fi
      - name: Commit promotion and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/promote-00406680.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Validate FUN_00406680 fast-pass block'
          git push origin HEAD:promote/00406680-fastpass-valid
