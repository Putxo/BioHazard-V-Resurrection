name: promote-00401670-temp
on:
  push:
    branches: [decomp/promote-00401670-ci]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/promote-00401670-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote metadata and regenerate reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('database/functions.csv')
          with path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = reader.fieldnames
          for row in rows:
              if row['stable_id'] == 'FUN_00401670':
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#64'
                  row['commit'] = '297c08deef41cfded262e60140983c7e4a79130e'
                  row['notes'] = 'Steam achievement clear-and-store helper; exact 71-entry API-name table recovered; PR #64 CI 5/5 PASS'
                  break
          else:
              raise SystemExit('FUN_00401670 not found')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          hist = Path('database/history.csv')
          line = 'FUN_00401670,2026-09-10,FAST_PASS,FAST_PASS_VALIDATED,297c08deef41cfded262e60140983c7e4a79130e,coordinator,PR #64 completed 5/5 CI checks\n'
          text = hist.read_text(encoding='utf-8')
          if line not in text:
              hist.write_text(text + line, encoding='utf-8')
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          rm .github/workflows/promote-00401670-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg .github/workflows/promote-00401670-temp.yml
          git commit -m 'Promote FUN_00401670 after PR #64 CI'
          git push origin HEAD:decomp/promote-00401670-ci
