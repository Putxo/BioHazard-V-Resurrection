name: export-canonical-1000-base
on:
  push:
    branches: [decomp/canonical-1000]
    paths: [.github/workflows/export-canonical-1000-base.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact branch source
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/canonical-1000-base.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-1000-base
          path: ${{ runner.temp }}/canonical-1000-base.tar
          retention-days: 1
          if-no-files-found: error
