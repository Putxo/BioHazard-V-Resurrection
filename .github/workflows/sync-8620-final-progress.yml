name: sync-8620-final-progress
on:
  push:
    branches:
      - decomp/00408620-final
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-progress]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00408620-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/functions.json reports/progress-treemap.svg reports/progress.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize FUN_00408620 reports [sync-progress]'
          git push origin HEAD:decomp/00408620-final
