name: materialize-canonical-1000-promotion
on:
  push:
    branches: [promote/canonical-1000]
    paths: [.github/workflows/materialize-canonical-1000-promotion.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/canonical-1000
          fetch-depth: 0
      - name: Promote exactly the 800 recovered entries after recovery CI
        shell: python
        env:
          START_SHA: ${{ github.sha }}
        run: |
          import hashlib,os,pathlib,subprocess,sys
          def run(*a,**k): return subprocess.run(a,check=True,**k)
          def out(*a): return subprocess.check_output(a,text=True).strip()
          assert out('git','rev-parse','HEAD')==os.environ['START_SHA']
          run(sys.executable,'tools/maintenance/canonical_1000.py','promote',
              '--recovery-pr','447',
              '--recovery-head','5c516f9355e6a1249c07acd6329295c0ba3515e6',
              '--recovery-merge','a10e19ddad5b26cff44f90c577df2e29fd03cfe9')
          expected={
            'database/functions.csv':'53cab5cba51b5e88c3910e961b87f824316fb25b1ae61f5d0356a82ca482bf4b',
            'database/history.csv':'b95a2d498aa1b1d108d388025817fdce5456a73eeeb0ac2ece68c5bb88d7f59e',
            'reports/functions.json':'0f2dedfbe3fd8d73cc49d7aa6fd6c549ff8d98cb15303afddc5761ff8d236e63',
            'reports/progress.md':'f56126736c1c758fe3f48b695d5c73070fd77fd66f603f4fbaf5ebe3a501caae',
            'reports/progress-treemap.svg':'6dc086247aba46c1a589349c85a01b3d2c5462a0042ed42ecb54187fa7af6202',
            'decomp/evidence/canonical_1000_promotion.json':'736ec9cfd148be1800886aa37356a052ea4914e7ff2c288d57a1a060c5463a4c',
          }
          for p,h in expected.items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,p
          tracked=set(filter(None,out('git','diff','--name-only').splitlines()))
          untracked=set(filter(None,out('git','ls-files','--others','--exclude-standard').splitlines()))
          changed=tracked|untracked
          required={'database/functions.csv','database/history.csv','reports/functions.json','reports/progress-treemap.svg','decomp/evidence/canonical_1000_promotion.json'}
          assert changed<=set(expected) and required<=changed,changed
          run('git','rm','.github/workflows/materialize-canonical-1000-promotion.yml')
          run('git','diff','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','add','--',*expected)
          run('git','commit','-m','Promote canonical 1000 leaf entries after recovery PR 447 CI')
          remote=out('git','ls-remote','origin','refs/heads/promote/canonical-1000').split()[0]
          assert remote==os.environ['START_SHA'],'remote branch advanced'
          run('git','push','origin','HEAD:refs/heads/promote/canonical-1000')
