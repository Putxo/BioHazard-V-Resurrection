name: prepare-main-00406540

on:
  push:
    branches:
      - release/main-00406540

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/main-00406540
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Publish only validated FUN_00406540 onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin promote/00406540-fastpass-valid
          src_ref=origin/promote/00406540-fastpass-valid

          mkdir -p include/re5/recovered src/recovered tests/unit decomp/evidence
          git show "$src_ref:include/re5/recovered/fun_00406540.hpp" > include/re5/recovered/fun_00406540.hpp
          git show "$src_ref:src/recovered/fun_00406540.cpp" > src/recovered/fun_00406540.cpp
          git show "$src_ref:tests/unit/test_fun_00406540.cpp" > tests/unit/test_fun_00406540.cpp
          git show "$src_ref:decomp/evidence/fun_00406540.md" > decomp/evidence/fun_00406540.md

          python - <<'PY'
          from pathlib import Path
          import csv, io, subprocess

          ref = 'origin/promote/00406540-fastpass-valid'
          def show(path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          src_anchor = '    src/recovered/fun_00406510.cpp\n'
          test_anchor = '    tests/unit/test_fun_00406510.cpp\n'
          if 'src/recovered/fun_00406540.cpp' not in text:
              if src_anchor not in text:
                  raise SystemExit('CMake source anchor missing')
              text = text.replace(src_anchor, src_anchor + '    src/recovered/fun_00406540.cpp\n', 1)
          if 'tests/unit/test_fun_00406540.cpp' not in text:
              if test_anchor not in text:
                  raise SystemExit('CMake test anchor missing')
              text = text.replace(test_anchor, test_anchor + '    tests/unit/test_fun_00406540.cpp\n', 1)
          cmake.write_text(text)

          smoke = Path('tests/unit/test_smoke.cpp')
          text = smoke.read_text()
          decl_anchor = 'void test_fun_00406510();\n'
          call_anchor = '    test_fun_00406510();\n'
          if 'void test_fun_00406540();' not in text:
              if decl_anchor not in text:
                  raise SystemExit('smoke declaration anchor missing')
              text = text.replace(decl_anchor, decl_anchor + 'void test_fun_00406540();\n', 1)
          if '    test_fun_00406540();' not in text:
              if call_anchor not in text:
                  raise SystemExit('smoke call anchor missing')
              text = text.replace(call_anchor, call_anchor + '    test_fun_00406540();\n', 1)
          smoke.write_text(text)

          def source_row(path, predicate):
              rows = list(csv.reader(io.StringIO(show(path))))
              for r in rows[1:]:
                  if predicate(r):
                      return r
              raise SystemExit(f'validated source row missing in {path}')

          def append_if_missing(path, predicate, row):
              p = Path(path)
              with p.open(newline='') as f:
                  rows = list(csv.reader(f))
              if not any(predicate(r) for r in rows[1:]):
                  with p.open('a', newline='') as f:
                      csv.writer(f, lineterminator='\n').writerow(row)

          claim = source_row('database/claims.csv', lambda r: r and r[0] == 'SEQ-00406540')
          append_if_missing('database/claims.csv', lambda r: r and r[0] == 'SEQ-00406540', claim)

          fun = source_row('database/functions.csv', lambda r: r and r[0] == 'FUN_00406540')
          append_if_missing('database/functions.csv', lambda r: r and r[0] == 'FUN_00406540', fun)

          hrows = list(csv.reader(io.StringIO(show('database/history.csv'))))
          wanted = [r for r in hrows[1:] if r and r[0] == 'FUN_00406540']
          if len(wanted) < 2:
              raise SystemExit('validated FUN_00406540 history rows incomplete')
          for row in wanted:
              key = (row[0], row[2], row[3])
              append_if_missing('database/history.csv', lambda r, k=key: len(r) >= 4 and (r[0],r[2],r[3]) == k, row)
          PY

      - name: Regenerate public dashboard and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-main-00406540.yml
          git add -A
          git commit -m "Publish validated FUN_00406540 dashboard"
          git push origin HEAD:release/main-00406540
