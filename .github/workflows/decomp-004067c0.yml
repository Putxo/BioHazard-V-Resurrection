name: Decompile FUN_004067C0
on:
  push:
    branches: [decomp/004067c0-next]
permissions:
  contents: write
jobs:
  decomp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire FUN_004067C0 and metadata
        shell: python
        run: |
          from pathlib import Path
          import csv, datetime

          p=Path('CMakeLists.txt'); s=p.read_text()
          if 'src/recovered/fun_004067c0.cpp' not in s:
              s=s.replace('    src/recovered/fun_004067a0.cpp\n)', '    src/recovered/fun_004067a0.cpp\n    src/recovered/fun_004067c0.cpp\n)')
          if 'tests/unit/test_fun_004067c0.cpp' not in s:
              s=s.replace('    tests/unit/test_fun_004067a0.cpp\n)', '    tests/unit/test_fun_004067a0.cpp\n    tests/unit/test_fun_004067c0.cpp\n)')
          p.write_text(s)

          p=Path('tests/unit/test_smoke.cpp'); s=p.read_text()
          if 'void test_fun_004067c0();' not in s:
              s=s.replace('void test_fun_004067a0();\n', 'void test_fun_004067a0();\nvoid test_fun_004067c0();\n')
          if '    test_fun_004067c0();' not in s:
              s=s.replace('    test_fun_004067a0();\n    return 0;', '    test_fun_004067a0();\n    test_fun_004067c0();\n    return 0;')
          p.write_text(s)

          def append_unique(path, key_index, key, row):
              p=Path(path)
              with p.open(newline='') as f: rows=list(csv.reader(f))
              assert not any(len(r)>key_index and r[key_index]==key for r in rows[1:]), f'{key} already exists in {path}'
              rows.append(row)
              with p.open('w', newline='') as f: csv.writer(f, lineterminator='\n').writerows(rows)

          append_unique('database/functions.csv', 0, 'FUN_004067C0', [
              'FUN_004067C0','0x004067C0','0x000067C0','.text','27','FUN_004067C0','','ACTIVE','HIGH',
              'true','false','false','false','false','false','false','cdecl','void','void','void','UNKNOWN','Resource',
              'src/recovered/fun_004067c0.cpp','coordinator','SEQ-004067C0','','','tests/unit/test_fun_004067c0.cpp',
              'decomp/evidence/fun_004067c0.md','ViewerResource fixed -1 forwarding wrapper with exact five-entry direct table and no resolved table'])

          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          append_unique('database/claims.csv', 1, 'FUN_004067C0', [
              'SEQ-004067C0','FUN_004067C0','coordinator','decomp/004067c0-next',
              'sequential decomp of ViewerResource forwarding wrapper',now,'','','true'])

          p=Path('database/history.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          assert not any(r and r[0]=='FUN_004067C0' for r in rows[1:])
          rows.append(['FUN_004067C0','2026-09-22','UNSEEN','FAST_PASS','','coordinator',
                       'recovered ViewerResource forwarding wrapper from exact executable'])
          with p.open('w', newline='') as f: csv.writer(f, lineterminator='\n').writerows(rows)
      - name: Regenerate canonical reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Validate metadata and reports
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Diff hygiene and reject binary products
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit reconstruction and remove temporary workflow
        run: |
          rm .github/workflows/decomp-004067c0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt database/claims.csv database/functions.csv database/history.csv reports/functions.json reports/progress-treemap.svg reports/progress.md tests/unit/test_smoke.cpp
          git commit -m 'Decompile FUN_004067C0 ViewerResource forwarding wrapper'
          git push
