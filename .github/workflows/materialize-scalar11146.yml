name: materialize-scalar11146
on:
  push:
    branches: [decomp/scalar-323d1aab-complete-bodies]
    paths: ['.github/scalar11146-transfer/**']
permissions:
  contents: write
concurrency:
  group: materialize-scalar11146
  cancel-in-progress: false
jobs:
  source-publication:
    if: github.repository == 'Putxo/BioHazard-V-Resurrection'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source-only transfer
        shell: python
        run: |
          import base64, hashlib, json, pathlib, zlib
          prefix = pathlib.Path('.github/scalar11146-transfer')
          text = ''.join((prefix / f'part-{i}.b85').read_text(encoding='utf-8') for i in range(4))
          packed = base64.b85decode(''.join(text.split()))
          assert len(packed) == 36528
          assert hashlib.sha256(packed).hexdigest() == '70c1365dc759beb5f1b152d6d58edd59bebf3ca24fa893e3ccf86dc13739269f'
          raw = zlib.decompress(packed)
          assert len(raw) == 69598
          assert hashlib.sha256(raw).hexdigest() == 'a46a4d11a3e0838ebc3cea64a34c216900dac992043dc6ad468f2bcc5a02f914'
          files = json.loads(raw)
          assert isinstance(files, dict) and len(files) == 16
          workflow = '.github/workflows/verify-scalar323d1aab.yml'
          forbidden = {'.exe', '.dll', '.obj', '.o', '.a', '.lib', '.so', '.bin', '.pdb', '.arc', '.pak'}
          for name, content in files.items():
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith('decomp/scalar323d1aab/') or name == workflow
              assert p.suffix.lower() not in forbidden
              assert isinstance(content, str) and '\0' not in content
              if name == workflow:
                  assert p.read_text(encoding='utf-8') == content
              else:
                  assert not p.exists(), name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(content, encoding='utf-8')
          print('PASS: 15 source/tooling files restored; existing read-only CI verified')
      - name: Generate ordinary readable C++ definitions and verify exact source identity
        run: |
          python decomp/scalar323d1aab/tools/generate.py
          python decomp/scalar323d1aab/tools/generate.py --check
      - name: Preserve current build and validate disjoint source addresses
        shell: python
        run: |
          import csv, hashlib, json, pathlib, subprocess
          p = pathlib.Path('CMakeLists.txt')
          old = p.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(old)).encode() + b'\0' + old).hexdigest()
          assert blob == '54e40b6d256aa603f50c0dee1bfdac690873d12d'
          assert b'add_subdirectory(decomp/scalar323d1aab)' not in old
          p.write_bytes(old + b'\n# Exact attached EXE: recovered scalar bodies and source-only tests.\nadd_subdirectory(decomp/scalar323d1aab)\n')
          scalar = json.loads(pathlib.Path('decomp/scalar323d1aab/generated/catalog.json').read_text())
          leaf = json.loads(pathlib.Path('decomp/leaf323d1aab/generated/catalog.json').read_text())
          recovered = {r['va'] for r in scalar['records']}
          previous = {r['va'] for r in leaf['records']}
          with open('database/functions.csv', newline='') as f:
              registered = {int(r['va'], 0) for r in csv.DictReader(f) if r.get('va')}
          assert len(recovered) == 11146 and len(previous) == 7171
          assert not recovered & previous
          assert not recovered & registered, sorted(recovered & registered)
          assert len(recovered | previous) == 18317
          assert json.loads(pathlib.Path('config/inventory_freeze.json').read_text())['function_candidate_denominator'] == 79782
          subprocess.run(['git', 'diff', '--exit-code', '--', 'database', 'config'], check=True)
          print('PASS: 11146 distinct new source bodies; leaf+scalar union18317; registry/config unchanged')
      - name: Build complete root project and run integrated tests
        run: |
          cmake -S . -B build-scalar-publication -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-scalar-publication --parallel 2
          ctest --test-dir build-scalar-publication --output-on-failure
      - name: Commit source only on reserved development branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'decomp/scalar-323d1aab-complete-bodies'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- decomp/scalar323d1aab CMakeLists.txt
          git rm -r -- .github/scalar11146-transfer
          git diff --cached --check
          python - <<'PY'
          import pathlib, subprocess
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          for path in changed:
              assert path == 'CMakeLists.txt' or path.startswith(('decomp/scalar323d1aab/', '.github/scalar11146-transfer/')), path
              assert pathlib.Path(path).suffix.lower() not in {'.exe', '.dll', '.obj', '.o', '.a', '.so', '.lib', '.bin', '.pdb', '.arc', '.pak'}, path
              assert '__pycache__' not in path, path
          PY
          git commit -m 'Publish 11146 recovered scalar C++ bodies and reproducible source tests'
          git push origin HEAD:refs/heads/decomp/scalar-323d1aab-complete-bodies
# Coordinator removes this one-time workflow through the API before final PR.
# GITHUB_TOKEN never edits workflow files and never accesses the original EXE.
