name: assemble-00401730-temp
on:
  push:
    branches: [decomp/00401730-sequential]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00401730-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          fpath=Path('database/functions.csv')
          with fpath.open(newline='',encoding='utf-8') as f:
              r=csv.DictReader(f); rows=list(r); fields=r.fieldnames
          if not any(x['stable_id']=='FUN_00401730' for x in rows):
              rows.append({'stable_id':'FUN_00401730','va':'0x00401730','rva':'0x00001730','section':'.text','size':'117','provisional_name':'FUN_00401730','refined_name':'','workflow_status':'ACTIVE','confidence':'HIGH','fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false','verified':'false','matched':'false','linked':'false','calling_convention':'cdecl','return_type':'uint32_t','arguments':'uint8_t* destination; uint32_t destination_size; const uint8_t* source; uint32_t length','this_type':'','module':'UNKNOWN','subsystem':'UNKNOWN','source_file':'src/recovered/fun_00401730.cpp','owner':'coordinator','claim_id':'SEQ-00401730','pr':'','commit':'','test':'tests/unit/test_fun_00401730.cpp','evidence':'decomp/evidence/fun_00401730.md','notes':'8-byte feedback XOR encoder; exact four-argument contract and processed-byte return recovered'})
          with fpath.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          c=Path('database/claims.csv'); t=c.read_text(encoding='utf-8'); line='SEQ-00401730,FUN_00401730,coordinator,decomp/00401730-sequential,sequential decomp of 8-byte feedback XOR encoder,2026-09-10T13:11:00Z,,,true\n';
          if line not in t: c.write_text(t+line,encoding='utf-8')
          h=Path('database/history.csv'); t=h.read_text(encoding='utf-8'); line='FUN_00401730,2026-09-10,UNSEEN,FAST_PASS,,coordinator,recovered exact 8-byte feedback XOR encode flow and four-argument contract\n';
          if line not in t: h.write_text(t+line,encoding='utf-8')
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          rm .github/workflows/assemble-00401730-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/claims.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg .github/workflows/assemble-00401730-temp.yml
          git commit -m 'Assemble FUN_00401730 fast pass metadata'
          git push origin HEAD:decomp/00401730-sequential
