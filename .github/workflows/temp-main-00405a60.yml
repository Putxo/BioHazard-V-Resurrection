name: prepare-main-00405a60

on:
  push:
    branches: [release/main-fastpass85-00405a60]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish only validated FUN_00405A60 metadata and wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          # Build wiring: only FUN_00405A60.
          p = Path('CMakeLists.txt')
          text = p.read_text(encoding='utf-8')
          src_line = '    src/recovered/fun_00405a60.cpp\n'
          if src_line not in text:
              anchor = '    src/recovered/fun_00405df0.cpp\n'
              if anchor not in text:
                  anchor = '    src/recovered/fun_00405710.cpp\n'
              if anchor not in text:
                  raise SystemExit('source anchor missing')
              text = text.replace(anchor, anchor + src_line, 1)
          test_line = '    tests/unit/test_fun_00405a60.cpp\n'
          if test_line not in text:
              anchor = '    tests/unit/test_fun_00405df0.cpp\n'
              if anchor not in text:
                  anchor = '    tests/unit/test_fun_00405710.cpp\n'
              if anchor not in text:
                  raise SystemExit('test anchor missing')
              text = text.replace(anchor, anchor + test_line, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/unit/test_smoke.cpp')
          text = p.read_text(encoding='utf-8')
          decl = 'void test_fun_00405a60();\n'
          if decl not in text:
              anchor = 'void test_fun_00405df0();\n'
              if anchor not in text:
                  anchor = 'void test_fun_00405710();\n'
              if anchor not in text:
                  raise SystemExit('smoke declaration anchor missing')
              text = text.replace(anchor, anchor + decl, 1)
          call = '    test_fun_00405a60();\n'
          if call not in text:
              anchor = '    test_fun_00405df0();\n'
              if anchor not in text:
                  anchor = '    test_fun_00405710();\n'
              if anchor not in text:
                  raise SystemExit('smoke call anchor missing')
              text = text.replace(anchor, anchor + call, 1)
          p.write_text(text, encoding='utf-8')

          # Claim: add only 00405A60.
          p = Path('database/claims.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          if not any(r.get('stable_id') == 'FUN_00405A60' for r in rows):
              rows.append({
                  'claim_id':'SEQ-00405A60','stable_id':'FUN_00405A60','owner':'coordinator',
                  'branch':'decomp/00405a60-next','task':'sequential decomp of static six-entry resource registration pass',
                  'claimed_at':'2026-09-21T21:45:00Z','expires_at':'','pr':'','active':'true'
              })
          with p.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(rows)

          # Validated function row exactly as integration after PR #170.
          p = Path('database/functions.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          if not any(r.get('stable_id') == 'FUN_00405A60' for r in rows):
              rows.append({
                  'stable_id':'FUN_00405A60','va':'0x00405A60','rva':'0x00005A60','section':'.text','size':'368',
                  'provisional_name':'FUN_00405A60','refined_name':'','workflow_status':'ACTIVE','confidence':'HIGH',
                  'fast_pass':'true','fast_pass_validated':'true','converted':'false','refined':'false','verified':'false','matched':'false','linked':'false',
                  'calling_convention':'cdecl','return_type':'void','arguments':'void','this_type':'void','module':'UNKNOWN','subsystem':'Resource',
                  'source_file':'src/recovered/fun_00405a60.cpp','owner':'coordinator','claim_id':'SEQ-00405A60','pr':'#169',
                  'commit':'4ff96307fac4ebb8a4481f79e1cc9f81df22c1e1','test':'tests/unit/test_fun_00405a60.cpp',
                  'evidence':'decomp/evidence/fun_00405a60.md',
                  'notes':'static six-entry resource registration pass with archive preflight early cancel loading-state preservation suppressor-aware bind and trace markers; PR #169 CI 5/5 PASS'
              })
          with p.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(rows)

          # History: only the two 00405A60 lifecycle rows.
          p = Path('database/history.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          if not any(r.get('stable_id') == 'FUN_00405A60' and r.get('new_status') == 'FAST_PASS' for r in rows):
              rows.append({'stable_id':'FUN_00405A60','date':'2026-09-21','old_status':'UNSEEN','new_status':'FAST_PASS','commit':'','owner':'coordinator','reason':'recovered static six-entry resource registration pass with archive preflight early cancel and loading-state restoration'})
          if not any(r.get('stable_id') == 'FUN_00405A60' and r.get('new_status') == 'FAST_PASS_VALIDATED' for r in rows):
              rows.append({'stable_id':'FUN_00405A60','date':'2026-09-21','old_status':'FAST_PASS','new_status':'FAST_PASS_VALIDATED','commit':'4ff96307fac4ebb8a4481f79e1cc9f81df22c1e1','owner':'coordinator','reason':'PR #169 completed 5/5 CI checks'})
          with p.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Regenerate public dashboard and reports
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
      - name: Validate metadata and diff
        run: |
          python tools/validate/validate.py
          git diff --check
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
      - name: Commit publication branch
        shell: bash
        run: |
          rm .github/workflows/temp-main-00405a60.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md database/claims.csv database/functions.csv database/history.csv reports/ tests/unit/test_smoke.cpp src/recovered/fun_00405a60.cpp include/re5/recovered/fun_00405a60.hpp tests/unit/test_fun_00405a60.cpp decomp/evidence/fun_00405a60.md .github/workflows/temp-main-00405a60.yml
          git commit -m 'Publish validated FUN_00405A60 dashboard'
          git push origin HEAD:release/main-fastpass85-00405a60
