name: publish-00406780

on:
  push:
    branches:
      - release/main-fastpass104-00406780

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/main-fastpass104-00406780
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply only validated FUN_00406780 delta
        shell: bash
        run: |
          VALIDATED=29d53ebca96c334bafe5c4df0fcf2941e4434dd2
          git fetch origin "$VALIDATED"
          git checkout "$VALIDATED" -- \
            include/re5/recovered/fun_00406780.hpp \
            src/recovered/fun_00406780.cpp \
            tests/unit/test_fun_00406780.cpp \
            decomp/evidence/fun_00406780.md
          git show "$VALIDATED":database/functions.csv > /tmp/integration-functions.csv
          git show "$VALIDATED":database/claims.csv > /tmp/integration-claims.csv
          git show "$VALIDATED":database/history.csv > /tmp/integration-history.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          target='FUN_00406780'
          def replace_target_rows(dst_path,src_path,key):
              dst=Path(dst_path); src=Path(src_path)
              with dst.open(newline='') as f: dst_rows=list(csv.DictReader(f)); fields=list(dst_rows[0].keys())
              with src.open(newline='') as f: src_rows=list(csv.DictReader(f))
              target_rows=[r for r in src_rows if r[key]==target]
              if not target_rows: raise SystemExit(f'{target} missing from {src_path}')
              dst_rows=[r for r in dst_rows if r[key]!=target]; dst_rows.extend(target_rows)
              with dst.open('w',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(dst_rows)
          replace_target_rows('database/functions.csv','/tmp/integration-functions.csv','stable_id')
          replace_target_rows('database/claims.csv','/tmp/integration-claims.csv','stable_id')
          replace_target_rows('database/history.csv','/tmp/integration-history.csv','stable_id')
          cmake=Path('CMakeLists.txt'); text=cmake.read_text(encoding='utf-8')
          src='    src/recovered/fun_00406780.cpp\n'; test='    tests/unit/test_fun_00406780.cpp\n'
          if src not in text:
              anchor='    src/recovered/fun_00406760.cpp\n'
              if anchor not in text: raise SystemExit('CMake source anchor FUN_00406760 missing')
              text=text.replace(anchor,anchor+src,1)
          if test not in text:
              anchor='    tests/unit/test_fun_00406760.cpp\n'
              if anchor not in text: raise SystemExit('CMake test anchor FUN_00406760 missing')
              text=text.replace(anchor,anchor+test,1)
          cmake.write_text(text,encoding='utf-8')
          smoke=Path('tests/unit/test_smoke.cpp'); text=smoke.read_text(encoding='utf-8')
          if 'void test_fun_00406780();' not in text:
              anchor='void test_fun_00406760();\n'
              if anchor not in text: raise SystemExit('smoke declaration anchor missing')
              text=text.replace(anchor,anchor+'void test_fun_00406780();\n',1)
          if '    test_fun_00406780();' not in text:
              anchor='    test_fun_00406760();\n'
              if anchor not in text: raise SystemExit('smoke call anchor missing')
              text=text.replace(anchor,anchor+'    test_fun_00406780();\n',1)
          smoke.write_text(text,encoding='utf-8')
          PY
      - name: Publish README and regenerate canonical progress
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/reports/report.py --publish-readme
          python tools/validate/validate.py
          git diff --check
      - name: Configure build and tests
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Reject binary-like release content
        shell: bash
        run: |
          if git diff --name-only HEAD | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then exit 1; fi
          if git ls-files --others --exclude-standard | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then exit 1; fi
      - name: Commit publication and remove helper
        shell: bash
        run: |
          rm .github/workflows/publish-00406780.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then exit 1; fi
          git commit -m 'Publish FUN_00406780 fast-pass dashboard [publish-00406780]'
          git push origin HEAD:release/main-fastpass104-00406780
