name: tmp-promote-004061f0

on:
  push:
    branches: [promote/004061f0-fastpass-valid]
    paths:
      - '.github/workflows/tmp-promote-004061f0.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote canonical metadata
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('database/functions.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          found = False
          for row in rows:
              if row['stable_id'] == 'FUN_004061F0':
                  found = True
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#181'
                  row['commit'] = '0a08af19efbd4c5387706ab5b6178537e73adfdc'
                  suffix = 'PR #181 CI 5/5 PASS'
                  if suffix not in row['notes']:
                      row['notes'] = row['notes'].rstrip('; ') + '; ' + suffix
          if not found:
              raise SystemExit('FUN_004061F0 row not found')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          h = Path('database/history.csv')
          text = h.read_text(encoding='utf-8')
          row = 'FUN_004061F0,2026-09-22,FAST_PASS,FAST_PASS_VALIDATED,0a08af19efbd4c5387706ab5b6178537e73adfdc,coordinator,PR #181 completed 5/5 CI checks'
          if row not in text:
              with h.open('a', encoding='utf-8') as f:
                  if text and not text.endswith('\n'): f.write('\n')
                  f.write(row + '\n')
          PY
      - name: Regenerate and validate
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          python -m pip install pytest
          python -m pytest -q tests/metadata
          git diff --check
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/progress.md reports/functions.json reports/progress-treemap.svg
          git diff --cached --quiet || git commit -m 'Validate FUN_004061F0 fast-pass block'
          git push
