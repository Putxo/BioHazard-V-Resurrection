name: promote-004022f0-004023e0-temp
on:
  push:
    branches:
      - decomp/promote-004022f0-004023e0-ci
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/promote-004022f0-004023e0-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote metadata and regenerate reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          ids={'FUN_004022F0','FUN_00402350','FUN_00402360','FUN_004023E0'}
          fpath=Path('database/functions.csv')
          with fpath.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          found=set()
          for r in rows:
              if r['stable_id'] in ids:
                  found.add(r['stable_id'])
                  r['fast_pass_validated']='true'
                  r['pr']='#113'
                  r['commit']='b1399de267185fea546263fd38f3e9d0b9d080fb'
                  if 'PR #113 CI 5/5 PASS' not in r['notes']:
                      r['notes']=r['notes']+'; PR #113 CI 5/5 PASS'
          missing=ids-found
          if missing:
              raise SystemExit(f'missing rows: {sorted(missing)}')
          with fpath.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          history=Path('database/history.csv')
          existing=history.read_text(encoding='utf-8')
          with history.open('a',newline='',encoding='utf-8') as f:
              w=csv.writer(f,lineterminator='\n')
              for sid in sorted(ids):
                  marker=f'{sid},2026-09-11,FAST_PASS,FAST_PASS_VALIDATED'
                  if marker not in existing:
                      w.writerow([sid,'2026-09-11','FAST_PASS','FAST_PASS_VALIDATED','b1399de267185fea546263fd38f3e9d0b9d080fb','coordinator','PR #113 completed 5/5 CI checks'])
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/promote-004022f0-004023e0-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Promote FUN_004022F0 through FUN_004023E0 after PR #113 CI'
          git push origin HEAD:decomp/promote-004022f0-004023e0-ci
