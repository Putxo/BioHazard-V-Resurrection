name: tmp-00405bd0-generate

on:
  push:
    branches: [decomp/00405bd0-next]
    paths-ignore:
      - 'reports/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate reports and validate metadata
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
      - name: Commit generated reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/progress.md reports/functions.json reports/progress-treemap.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate FUN_00405BD0 reports'
            git push
          fi
