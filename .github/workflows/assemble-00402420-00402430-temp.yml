name: assemble-00402420-00402430-temp
on:
  push:
    branches:
      - decomp/00402420-00402430-sequential
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00402420-00402430-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          rows=[
              dict(stable_id='FUN_00402420',va='0x00402420',rva='0x00002420',section='.text',size='16',provisional_name='FUN_00402420',refined_name='',workflow_status='ACTIVE',confidence='HIGH',fast_pass='true',fast_pass_validated='false',converted='false',refined='false',verified='false',matched='false',linked='false',calling_convention='thiscall',return_type='const char*',arguments='const FUN_00402360_String* this',this_type='const FUN_00402360_String*',module='UNKNOWN',subsystem='Strings',source_file='src/recovered/fun_004022f0.cpp',owner='coordinator',claim_id='SEQ-00402420',pr='',commit='',test='tests/unit/test_fun_004022f0.cpp',evidence='decomp/evidence/fun_00402420.md',notes='returns block data at +0x08 or fixed fallback string address 0x0137AA5C'),
              dict(stable_id='FUN_00402430',va='0x00402430',rva='0x00002430',section='.text',size='80',provisional_name='FUN_00402430',refined_name='',workflow_status='ACTIVE',confidence='HIGH',fast_pass='true',fast_pass_validated='false',converted='false',refined='false',verified='false',matched='false',linked='false',calling_convention='thiscall',return_type='FUN_00402360_String*',arguments='FUN_00402360_String* this; const FUN_00402360_String* source',this_type='FUN_00402360_String*',module='UNKNOWN',subsystem='Strings',source_file='src/recovered/fun_004022f0.cpp',owner='coordinator',claim_id='SEQ-00402430',pr='',commit='',test='tests/unit/test_fun_004022f0.cpp',evidence='decomp/evidence/fun_00402430.md',notes='releases current refcounted string then reconstructs from source data or fallback literal'),
          ]
          fpath=Path('database/functions.csv')
          with fpath.open(newline='',encoding='utf-8') as f:
              existing=list(csv.DictReader(f)); fields=list(existing[0].keys())
          ids={r['stable_id'] for r in existing}
          for row in rows:
              if row['stable_id'] not in ids:
                  existing.append(row)
          with fpath.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(existing)

          claims=Path('database/claims.csv')
          existing_claims=claims.read_text(encoding='utf-8')
          claim_rows=[
              'SEQ-00402420,FUN_00402420,coordinator,decomp/00402420-00402430-sequential,sequential decomp of refcounted string data/fallback accessor,2026-09-11T07:52:00Z,,,true',
              'SEQ-00402430,FUN_00402430,coordinator,decomp/00402420-00402430-sequential,sequential decomp of refcounted string replacement helper,2026-09-11T07:53:00Z,,,true',
          ]
          with claims.open('a',encoding='utf-8',newline='') as f:
              for line in claim_rows:
                  if line.split(',')[0] not in existing_claims:
                      f.write(line+'\n')

          history=Path('database/history.csv')
          existing_history=history.read_text(encoding='utf-8')
          hist_rows=[
              ['FUN_00402420','2026-09-11','UNSEEN','FAST_PASS','','coordinator','recovered exact refcounted string data/fallback pointer accessor'],
              ['FUN_00402430','2026-09-11','UNSEEN','FAST_PASS','','coordinator','recovered refcounted string replacement flow using release plus constructor'],
          ]
          with history.open('a',newline='',encoding='utf-8') as f:
              w=csv.writer(f,lineterminator='\n')
              for row in hist_rows:
                  marker=','.join(row[:4])
                  if marker not in existing_history:
                      w.writerow(row)
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/assemble-00402420-00402430-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/claims.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Assemble FUN_00402420 and FUN_00402430 fast pass metadata'
          git push origin HEAD:decomp/00402420-00402430-sequential
