name: assemble-00401880-temp
on:
  push:
    branches:
      - decomp/00401880-sequential
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00401880-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          with Path('database/claims.csv').open('a', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerow([
                  'SEQ-00401880','FUN_00401880','coordinator','decomp/00401880-sequential',
                  'sequential decomp of SteamFriends slot +0x00 bounded string helper',
                  '2026-09-10T15:01:00Z','','','true'])

          with Path('database/history.csv').open('a', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerow([
                  'FUN_00401880','2026-09-10','UNSEEN','FAST_PASS','','coordinator',
                  'recovered SteamFriends slot +0x00 bounded string copy with forced terminator and return passthrough'])

          fpath = Path('database/functions.csv')
          with fpath.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          if any(r['stable_id'] == 'FUN_00401880' for r in rows):
              raise SystemExit('FUN_00401880 already present')
          row = {k: '' for k in fields}
          row.update({
              'stable_id':'FUN_00401880','va':'0x00401880','rva':'0x00001880','section':'.text','size':'64',
              'provisional_name':'FUN_00401880','workflow_status':'ACTIVE','confidence':'HIGH',
              'fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false',
              'verified':'false','matched':'false','linked':'false','calling_convention':'cdecl','return_type':'char*',
              'arguments':'char* destination; uint32_t capacity','module':'UNKNOWN','subsystem':'UNKNOWN',
              'source_file':'src/recovered/fun_00401880.cpp','owner':'coordinator','claim_id':'SEQ-00401880',
              'test':'tests/unit/test_fun_00401880.cpp','evidence':'decomp/evidence/fun_00401880.md',
              'notes':'SteamFriends virtual slot +0x00 string helper; bounded capacity-1 copy, forced NUL, destination/null return'
          })
          rows.append(row)
          with fpath.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/assemble-00401880-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/claims.csv database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Assemble FUN_00401880 fast pass metadata'
          git push origin HEAD:decomp/00401880-sequential
