name: assemble-004022f0-004023e0-temp
on:
  push:
    branches:
      - decomp/004022f0-004023e0-sequential
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/004022f0-004023e0-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          branch='decomp/004022f0-004023e0-sequential'
          rows = [
              dict(stable_id='FUN_004022F0', va='0x004022F0', rva='0x000022F0', section='.text', size='96', provisional_name='FUN_004022F0', refined_name='', workflow_status='ACTIVE', confidence='HIGH', fast_pass='true', fast_pass_validated='false', converted='false', refined='false', verified='false', matched='false', linked='false', calling_convention='cdecl', return_type='int', arguments='const FUN_004022F0_Object* object; const char* input', this_type='', module='UNKNOWN', subsystem='Utility', source_file='src/recovered/fun_004022f0.cpp', owner='coordinator', claim_id='SEQ-004022F0', pr='', commit='', test='tests/unit/test_fun_004022f0.cpp', evidence='decomp/evidence/fun_004022f0.md', notes='object string compare at target +0x08; null-object path compares one byte against literal at 0x0137AA5C'),
              dict(stable_id='FUN_00402350', va='0x00402350', rva='0x00002350', section='.text', size='16', provisional_name='FUN_00402350', refined_name='', workflow_status='ACTIVE', confidence='HIGH', fast_pass='true', fast_pass_validated='false', converted='false', refined='false', verified='false', matched='false', linked='false', calling_convention='cdecl', return_type='uint32_t', arguments='const FUN_00402350_Object* object', this_type='', module='UNKNOWN', subsystem='Utility', source_file='src/recovered/fun_004022f0.cpp', owner='coordinator', claim_id='SEQ-00402350', pr='', commit='', test='tests/unit/test_fun_004022f0.cpp', evidence='decomp/evidence/fun_00402350.md', notes='null-safe indirect dword getter through target object field +0x04'),
              dict(stable_id='FUN_00402360', va='0x00402360', rva='0x00002360', section='.text', size='128', provisional_name='FUN_00402360', refined_name='', workflow_status='ACTIVE', confidence='HIGH', fast_pass='true', fast_pass_validated='false', converted='false', refined='false', verified='false', matched='false', linked='false', calling_convention='thiscall', return_type='FUN_00402360_String*', arguments='FUN_00402360_String* this; const char* input', this_type='FUN_00402360_String*', module='UNKNOWN', subsystem='Strings', source_file='src/recovered/fun_004022f0.cpp', owner='coordinator', claim_id='SEQ-00402360', pr='', commit='', test='tests/unit/test_fun_004022f0.cpp', evidence='decomp/evidence/fun_00402360.md', notes='reference-counted string constructor; allocates length+0x0C at alignment 0x10 through global allocator slot +0x14'),
              dict(stable_id='FUN_004023E0', va='0x004023E0', rva='0x000023E0', section='.text', size='64', provisional_name='FUN_004023E0', refined_name='', workflow_status='ACTIVE', confidence='HIGH', fast_pass='true', fast_pass_validated='false', converted='false', refined='false', verified='false', matched='false', linked='false', calling_convention='thiscall', return_type='void', arguments='FUN_00402360_String* this', this_type='FUN_00402360_String*', module='UNKNOWN', subsystem='Strings', source_file='src/recovered/fun_004022f0.cpp', owner='coordinator', claim_id='SEQ-004023E0', pr='', commit='', test='tests/unit/test_fun_004022f0.cpp', evidence='decomp/evidence/fun_004023e0.md', notes='reference-counted string release; decrements count and frees at zero through global allocator slot +0x18'),
          ]

          fpath=Path('database/functions.csv')
          with fpath.open(newline='',encoding='utf-8') as f:
              existing=list(csv.DictReader(f)); fields=list(existing[0].keys())
          ids={r['stable_id'] for r in existing}
          for row in rows:
              if row['stable_id'] not in ids:
                  existing.append(row)
          with fpath.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(existing)

          claims=Path('database/claims.csv')
          existing_claims=claims.read_text(encoding='utf-8')
          claim_rows=[
              'SEQ-004022F0,FUN_004022F0,coordinator,'+branch+',sequential decomp of object/fallback string comparison,2026-09-11T07:40:00Z,,,true',
              'SEQ-00402350,FUN_00402350,coordinator,'+branch+',sequential decomp of null-safe indirect dword getter,2026-09-11T07:41:00Z,,,true',
              'SEQ-00402360,FUN_00402360,coordinator,'+branch+',sequential decomp of reference-counted string constructor,2026-09-11T07:42:00Z,,,true',
              'SEQ-004023E0,FUN_004023E0,coordinator,'+branch+',sequential decomp of reference-counted string release,2026-09-11T07:43:00Z,,,true',
          ]
          with claims.open('a',encoding='utf-8',newline='') as f:
              for line in claim_rows:
                  if line.split(',')[0] not in existing_claims:
                      f.write(line+'\n')

          history=Path('database/history.csv')
          existing_history=history.read_text(encoding='utf-8')
          hist_rows=[
              ['FUN_004022F0','2026-09-11','UNSEEN','FAST_PASS','','coordinator','recovered object string compare plus null-object one-byte fallback compare'],
              ['FUN_00402350','2026-09-11','UNSEEN','FAST_PASS','','coordinator','recovered null-safe indirect dword getter'],
              ['FUN_00402360','2026-09-11','UNSEEN','FAST_PASS','','coordinator','recovered reference-counted string constructor and allocator contract'],
              ['FUN_004023E0','2026-09-11','UNSEEN','FAST_PASS','','coordinator','recovered reference-counted string release and free contract'],
          ]
          with history.open('a',newline='',encoding='utf-8') as f:
              w=csv.writer(f,lineterminator='\n')
              for row in hist_rows:
                  marker=','.join(row[:4])
                  if marker not in existing_history:
                      w.writerow(row)
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/assemble-004022f0-004023e0-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/claims.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Assemble FUN_004022F0 through FUN_004023E0 fast pass metadata'
          git push origin HEAD:decomp/004022f0-004023e0-sequential
