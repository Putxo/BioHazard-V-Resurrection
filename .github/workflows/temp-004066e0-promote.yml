name: prepare-004066e0-promotion

on:
  push:
    branches:
      - promote/004066e0-fastpass-valid

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/004066e0-fastpass-valid
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote FUN_004066E0 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          p = Path('database/functions.csv')
          with p.open(newline='') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              assert fields is not None
              rows = list(reader)
          found = 0
          for row in rows:
              if row['stable_id'] == 'FUN_004066E0':
                  found += 1
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#214'
                  row['commit'] = '454d328671f10c83db6468366bcd883f5e36dfc1'
                  row['notes'] = 'MerceResource fixed -1 forwarding wrapper with exact eight-entry direct table and no resolved table; PR #214 CI 5/5 PASS'
          assert found == 1
          with p.open('w', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          history = Path('database/history.csv')
          with history.open(newline='') as f:
              reader = csv.DictReader(f)
              hfields = reader.fieldnames
              assert hfields is not None
              hrows = list(reader)
          if any(r['stable_id'] == 'FUN_004066E0' and r['new_status'] == 'FAST_PASS_VALIDATED' for r in hrows):
              raise SystemExit('FUN_004066E0 already promoted')
          with history.open('a', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=hfields, lineterminator='\n')
              writer.writerow({
                  'stable_id': 'FUN_004066E0',
                  'date': '2026-09-22',
                  'old_status': 'FAST_PASS',
                  'new_status': 'FAST_PASS_VALIDATED',
                  'commit': '454d328671f10c83db6468366bcd883f5e36dfc1',
                  'owner': 'coordinator',
                  'reason': 'PR #214 completed 5/5 CI checks',
              })

          evidence = Path('decomp/evidence/fun_004066e0.md')
          text = evidence.read_text()
          marker = '## Validation promotion'
          assert marker not in text
          evidence.write_text(text.rstrip() + '\n\n## Validation promotion\n\nPR #214 completed the standard 5/5 CI suite and merged into `integration` as `454d328671f10c83db6468366bcd883f5e36dfc1`. The `FAST_PASS_VALIDATED` promotion is based on that exact validated merge.\n')
          PY
      - name: Regenerate and validate promotion
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev --output-on-failure
      - name: Commit promotion
        run: |
          rm -f .github/workflows/temp-004066e0-promote.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Validate FUN_004066E0 fast-pass block'
          git push origin HEAD:promote/004066e0-fastpass-valid
