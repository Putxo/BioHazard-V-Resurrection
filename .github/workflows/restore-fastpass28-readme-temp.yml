name: restore-fastpass28-readme-temp
on:
  push:
    branches:
      - release/main-fastpass28-clean
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/main-fastpass28-clean
          fetch-depth: 0
      - name: Restore public README and update counts
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:README.md > README.md
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('28 / 79,782','29 / 79,782',1)
          s=s.replace('1,681 / 15,568,343','1,809 / 15,568,343',1)
          s=s.replace('27 / 79,782','28 / 79,782',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/restore-fastpass28-readme-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Restore public dashboard for FAST_PASS 28'
          git push origin HEAD:release/main-fastpass28-clean
