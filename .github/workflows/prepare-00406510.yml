name: prepare-00406510

on:
  push:
    branches:
      - decomp/00406510-next

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00406510-next
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire FUN_00406510 and metadata
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          src = '    src/recovered/fun_00406510.cpp\n'
          test = '    tests/unit/test_fun_00406510.cpp\n'
          if src not in text:
              anchor = '    src/recovered/fun_004064e0.cpp\n'
              if anchor not in text:
                  raise SystemExit('CMake source anchor missing')
              text = text.replace(anchor, anchor + src, 1)
          if test not in text:
              anchor = '    tests/unit/test_fun_004064e0.cpp\n'
              if anchor not in text:
                  raise SystemExit('CMake test anchor missing')
              text = text.replace(anchor, anchor + test, 1)
          cmake.write_text(text)

          smoke = Path('tests/unit/test_smoke.cpp')
          text = smoke.read_text()
          if 'void test_fun_00406510();' not in text:
              anchor = 'void test_fun_004064e0();\n'
              if anchor not in text:
                  raise SystemExit('smoke declaration anchor missing')
              text = text.replace(anchor, anchor + 'void test_fun_00406510();\n', 1)
          if '    test_fun_00406510();' not in text:
              anchor = '    test_fun_004064e0();\n'
              if anchor not in text:
                  raise SystemExit('smoke call anchor missing')
              text = text.replace(anchor, anchor + '    test_fun_00406510();\n', 1)
          smoke.write_text(text)

          def append_dict_row(path_str, key_field, key_value, row):
              path = Path(path_str)
              with path.open(newline='') as f:
                  rows = list(csv.DictReader(f))
                  fields = list(rows[0].keys()) if rows else list(row.keys())
              if not any(r.get(key_field) == key_value for r in rows):
                  rows.append(row)
                  with path.open('w', newline='') as f:
                      w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                      w.writeheader()
                      w.writerows(rows)

          append_dict_row('database/functions.csv', 'stable_id', 'FUN_00406510', {
              'stable_id': 'FUN_00406510',
              'va': '0x00406510',
              'rva': '0x00006510',
              'section': '.text',
              'size': '33',
              'provisional_name': 'FUN_00406510',
              'refined_name': '',
              'workflow_status': 'ACTIVE',
              'confidence': 'HIGH',
              'fast_pass': 'true',
              'fast_pass_validated': 'false',
              'converted': 'false',
              'refined': 'false',
              'verified': 'false',
              'matched': 'false',
              'linked': 'false',
              'calling_convention': 'cdecl',
              'return_type': 'void',
              'arguments': 'std::uint32_t selector',
              'this_type': 'void',
              'module': 'UNKNOWN',
              'subsystem': 'Resource',
              'source_file': 'src/recovered/fun_00406510.cpp',
              'owner': 'coordinator',
              'claim_id': 'SEQ-00406510',
              'pr': '',
              'commit': '',
              'test': 'tests/unit/test_fun_00406510.cpp',
              'evidence': 'decomp/evidence/fun_00406510.md',
              'notes': 'ShowGameResource forwarding wrapper to separately assigned 0x004061F0 with exact archive literal and 13/5 table tokens'
          })

          append_dict_row('database/claims.csv', 'claim_id', 'SEQ-00406510', {
              'claim_id': 'SEQ-00406510',
              'stable_id': 'FUN_00406510',
              'owner': 'coordinator',
              'branch': 'decomp/00406510-next',
              'task': 'sequential decomp of ShowGameResource forwarding wrapper',
              'claimed_at': '2026-09-21T22:18:00Z',
              'expires_at': '',
              'pr': '',
              'active': 'true'
          })

          path = Path('database/history.csv')
          with path.open(newline='') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          if not any(r.get('stable_id') == 'FUN_00406510' and r.get('old_status') == 'UNSEEN' and r.get('new_status') == 'FAST_PASS' for r in rows):
              rows.append({
                  'stable_id': 'FUN_00406510',
                  'date': '2026-09-21',
                  'old_status': 'UNSEEN',
                  'new_status': 'FAST_PASS',
                  'commit': '',
                  'owner': 'coordinator',
                  'reason': 'recovered 33-byte ShowGameResource forwarding wrapper with exact selector archive literal table tokens and counts'
              })
              with path.open('w', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader()
                  w.writerows(rows)
          PY
      - name: Regenerate and validate
        shell: bash
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
      - name: Build and test
        shell: bash
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Reject binary-like staged content
        shell: bash
        run: |
          if git status --porcelain | awk '{print $2}' | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then
            echo 'Binary-like file detected' >&2
            exit 1
          fi
      - name: Commit prepared candidate and remove helper
        shell: bash
        run: |
          rm .github/workflows/prepare-00406510.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt tests/unit/test_smoke.cpp database/functions.csv database/claims.csv database/history.csv reports .github/workflows/prepare-00406510.yml
          git commit -m 'Register and validate FUN_00406510 [prepare-00406510]'
          git push origin HEAD:decomp/00406510-next
