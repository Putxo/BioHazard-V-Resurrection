name: Classify candidate 00407A10
on:
  push:
    branches: [decomp/00407a10-next]
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Regenerate canonical reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Validate repository
        run: python tools/validate/validate.py
      - name: Build and test current recovered code
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Hygiene and binary rejection
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit regenerated reports and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/classify-00407a10.yml
          git add config/inventory_freeze.json decomp/evidence/candidate_00407a10.md reports/function-count-audit.md reports/functions.json reports/progress-treemap.svg reports/progress.md
          git commit -m 'Classify 00407A10 as jump-table data'
          git push
