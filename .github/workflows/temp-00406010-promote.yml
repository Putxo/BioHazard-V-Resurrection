name: prepare-00406010-promotion

on:
  push:
    branches: [promote/00406010-fastpass-valid]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote FUN_00406010 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          p = Path('database/functions.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          found = False
          for r in rows:
              if r.get('stable_id') == 'FUN_00406010':
                  found = True
                  r['fast_pass'] = 'true'
                  r['fast_pass_validated'] = 'true'
                  r['pr'] = '#176'
                  r['commit'] = '5b516c943a6e225d66638905842d332586889ff8'
                  note = r.get('notes','')
                  suffix = 'PR #176 CI 5/5 PASS'
                  if suffix not in note:
                      r['notes'] = (note + '; ' + suffix).strip('; ')
          if not found: raise SystemExit('FUN_00406010 metadata row missing')
          with p.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p = Path('database/history.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          if not any(r.get('stable_id') == 'FUN_00406010' and r.get('new_status') == 'FAST_PASS_VALIDATED' for r in rows):
              rows.append({'stable_id':'FUN_00406010','date':'2026-09-22','old_status':'FAST_PASS','new_status':'FAST_PASS_VALIDATED','commit':'5b516c943a6e225d66638905842d332586889ff8','owner':'coordinator','reason':'PR #176 completed 5/5 CI checks'})
          with p.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Regenerate and validate
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit promotion
        shell: bash
        run: |
          rm .github/workflows/temp-00406010-promote.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/ .github/workflows/temp-00406010-promote.yml
          git commit -m 'Validate FUN_00406010 fast-pass block'
          git push origin HEAD:promote/00406010-fastpass-valid
