name: verify-attachment-323d1aab

on:
  pull_request:
    branches: [main, integration]
  push:
    branches: [main, integration, import/attachment-323d1aab-verified]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-and-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang-sanitized]
    steps:
      - uses: actions/checkout@v4
      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: cmake -S verification/attachment-323d1aab -B build-attachment -DCMAKE_BUILD_TYPE=Release
      - name: Configure Clang with sanitizers
        if: matrix.compiler == 'clang-sanitized'
        run: >-
          cmake -S verification/attachment-323d1aab -B build-attachment
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-attachment --parallel 2
      - name: Test reference and canonical wrapper
        run: ctest --test-dir build-attachment --output-on-failure
      - name: Compile reference to Windows x86 object (not linked or executed)
        if: matrix.compiler == 'clang-sanitized'
        run: >-
          clang++ --target=i686-pc-windows-msvc -std=c++17 -Wall -Wextra -Wpedantic -Werror
          -Iverification/attachment-323d1aab/include
          -c verification/attachment-323d1aab/src/recovered.cpp
          -o build-attachment/reference-x86.obj
