name: Publish FUN_00406840
on:
  push:
    branches: [release/main-fastpass110-00406840]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch validated integration snapshot
        run: git fetch origin integration
      - name: Apply validated FUN_00406840 snapshot
        run: |
          git show 57a00fda39da590a0a8d5e7c712291962c897ee4:include/re5/recovered/fun_00406840.hpp > include/re5/recovered/fun_00406840.hpp
          git show 57a00fda39da590a0a8d5e7c712291962c897ee4:src/recovered/fun_00406840.cpp > src/recovered/fun_00406840.cpp
          git show 57a00fda39da590a0a8d5e7c712291962c897ee4:tests/unit/test_fun_00406840.cpp > tests/unit/test_fun_00406840.cpp
          git show 57a00fda39da590a0a8d5e7c712291962c897ee4:decomp/evidence/fun_00406840.md > decomp/evidence/fun_00406840.md
      - name: Merge target metadata and wiring only
        shell: python
        run: |
          from pathlib import Path
          import csv, subprocess, io

          snap='57a00fda39da590a0a8d5e7c712291962c897ee4'
          def show(path):
              return subprocess.check_output(['git','show',f'{snap}:{path}'], text=True)

          def merge_rows(path, predicate):
              p=Path(path)
              with p.open(newline='') as f: current=list(csv.reader(f))
              source=list(csv.reader(io.StringIO(show(path))))
              header=current[0]
              assert source[0]==header
              selected=[r for r in source[1:] if predicate(r)]
              assert selected, f'no selected rows for {path}'
              kept=[r for r in current[1:] if not predicate(r)]
              with p.open('w',newline='') as f:
                  csv.writer(f,lineterminator='\n').writerows([header]+kept+selected)

          merge_rows('database/functions.csv', lambda r: r and r[0]=='FUN_00406840')
          merge_rows('database/claims.csv', lambda r: len(r)>1 and r[1]=='FUN_00406840')
          merge_rows('database/history.csv', lambda r: r and r[0]=='FUN_00406840')

          p=Path('CMakeLists.txt'); s=p.read_text()
          if 'src/recovered/fun_00406840.cpp' not in s:
              marker='    src/recovered/fun_004067e0.cpp\n)'
              assert marker in s
              s=s.replace(marker,'    src/recovered/fun_004067e0.cpp\n    src/recovered/fun_00406840.cpp\n)')
          if 'tests/unit/test_fun_00406840.cpp' not in s:
              marker='    tests/unit/test_fun_004067e0.cpp\n)'
              assert marker in s
              s=s.replace(marker,'    tests/unit/test_fun_004067e0.cpp\n    tests/unit/test_fun_00406840.cpp\n)')
          p.write_text(s)

          p=Path('tests/unit/test_smoke.cpp'); s=p.read_text()
          if 'void test_fun_00406840();' not in s:
              marker='void test_fun_004067e0();\n'
              assert marker in s
              s=s.replace(marker,marker+'void test_fun_00406840();\n')
          if '    test_fun_00406840();' not in s:
              marker='    test_fun_004067e0();\n    return 0;'
              assert marker in s
              s=s.replace(marker,'    test_fun_004067e0();\n    test_fun_00406840();\n    return 0;')
          p.write_text(s)
      - name: Regenerate public reports
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
      - name: Validate
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Diff hygiene and binary rejection
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit publication and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-00406840.yml
          git add CMakeLists.txt README.md database/claims.csv database/functions.csv database/history.csv decomp/evidence/fun_00406840.md include/re5/recovered/fun_00406840.hpp reports/functions.json reports/progress-treemap.svg reports/progress.md src/recovered/fun_00406840.cpp tests/unit/test_fun_00406840.cpp tests/unit/test_smoke.cpp
          git commit -m 'Publish FUN_00406840 fast-pass dashboard [publish-00406840]'
          git push
