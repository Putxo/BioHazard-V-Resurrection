name: Decompile FUN_00406570

on:
  push:
    branches:
      - decomp/00406570-next

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00406570-next
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add reconstructed source tests evidence and metadata
        shell: bash
        run: |
          cat > include/re5/recovered/fun_00406570.hpp <<'EOF'
          #pragma once

          #include <cstdint>

          namespace re5::recovered {

          struct FUN_00406570_Services {
              void* context;
              void (*log_marker)(void* context, const char* marker) noexcept;
              void (*dispatch_resource_group)(
                  void* context,
                  std::int32_t message_index,
                  const char* archive_name,
                  std::uintptr_t direct_table,
                  std::uint32_t direct_count,
                  std::uintptr_t resolved_table,
                  std::uint32_t resolved_count) noexcept;
          };

          void FUN_00406570_SetServices(const FUN_00406570_Services* services) noexcept;
          void FUN_00406570() noexcept;

          } // namespace re5::recovered
          EOF

          cat > src/recovered/fun_00406570.cpp <<'EOF'
          #include "re5/recovered/fun_00406570.hpp"

          namespace re5::recovered {
          namespace {
          const FUN_00406570_Services* g_services = nullptr;

          constexpr const char* k_log_marker = ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>\n";
          constexpr const char* k_archive_name = "Image\\Archive\\TitleResource";
          constexpr std::int32_t k_message_index = -1;
          constexpr std::uintptr_t k_direct_table = 0x01567708U;
          constexpr std::uint32_t k_direct_count = 24U;
          constexpr std::uintptr_t k_resolved_table = 0U;
          constexpr std::uint32_t k_resolved_count = 0U;
          } // namespace

          void FUN_00406570_SetServices(const FUN_00406570_Services* services) noexcept {
              g_services = services;
          }

          void FUN_00406570() noexcept {
              const auto* services = g_services;
              if (services == nullptr) {
                  return;
              }

              if (services->log_marker != nullptr) {
                  services->log_marker(services->context, k_log_marker);
              }

              if (services->dispatch_resource_group != nullptr) {
                  services->dispatch_resource_group(
                      services->context,
                      k_message_index,
                      k_archive_name,
                      k_direct_table,
                      k_direct_count,
                      k_resolved_table,
                      k_resolved_count);
              }
          }

          } // namespace re5::recovered
          EOF

          cat > tests/unit/test_fun_00406570.cpp <<'EOF'
          #include "re5/recovered/fun_00406570.hpp"

          #include <cassert>
          #include <cstdint>
          #include <cstring>

          namespace {
          struct State {
              unsigned log_calls = 0U;
              unsigned dispatch_calls = 0U;
              const char* marker = nullptr;
              std::int32_t message_index = 0;
              const char* archive_name = nullptr;
              std::uintptr_t direct_table = 0U;
              std::uint32_t direct_count = 0U;
              std::uintptr_t resolved_table = 1U;
              std::uint32_t resolved_count = 1U;
              char order[3]{};
              unsigned order_count = 0U;
          };

          void log_marker(void* context, const char* marker) noexcept {
              auto& state = *static_cast<State*>(context);
              ++state.log_calls;
              state.marker = marker;
              state.order[state.order_count++] = 'L';
          }

          void dispatch_resource_group(
              void* context,
              std::int32_t message_index,
              const char* archive_name,
              std::uintptr_t direct_table,
              std::uint32_t direct_count,
              std::uintptr_t resolved_table,
              std::uint32_t resolved_count) noexcept {
              auto& state = *static_cast<State*>(context);
              ++state.dispatch_calls;
              state.message_index = message_index;
              state.archive_name = archive_name;
              state.direct_table = direct_table;
              state.direct_count = direct_count;
              state.resolved_table = resolved_table;
              state.resolved_count = resolved_count;
              state.order[state.order_count++] = 'D';
          }
          } // namespace

          void test_fun_00406570() {
              using namespace re5::recovered;

              // Portable-host early exit only. The native 42-byte wrapper has no branch.
              FUN_00406570_SetServices(nullptr);
              FUN_00406570();

              State log_only{};
              FUN_00406570_Services log_only_services{&log_only, log_marker, nullptr};
              FUN_00406570_SetServices(&log_only_services);
              FUN_00406570();
              assert(log_only.log_calls == 1U);
              assert(log_only.dispatch_calls == 0U);
              assert(log_only.marker != nullptr);
              assert(std::strcmp(log_only.marker, ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>\n") == 0);
              assert(log_only.order_count == 1U && log_only.order[0] == 'L');

              State dispatch_only{};
              FUN_00406570_Services dispatch_only_services{&dispatch_only, nullptr, dispatch_resource_group};
              FUN_00406570_SetServices(&dispatch_only_services);
              FUN_00406570();
              assert(dispatch_only.log_calls == 0U);
              assert(dispatch_only.dispatch_calls == 1U);
              assert(dispatch_only.message_index == -1);
              assert(dispatch_only.archive_name != nullptr);
              assert(std::strcmp(dispatch_only.archive_name, "Image\\Archive\\TitleResource") == 0);
              assert(dispatch_only.direct_table == 0x01567708U);
              assert(dispatch_only.direct_count == 24U);
              assert(dispatch_only.resolved_table == 0U);
              assert(dispatch_only.resolved_count == 0U);
              assert(dispatch_only.order_count == 1U && dispatch_only.order[0] == 'D');

              State state{};
              FUN_00406570_Services services{&state, log_marker, dispatch_resource_group};
              FUN_00406570_SetServices(&services);
              FUN_00406570();
              assert(state.log_calls == 1U);
              assert(state.dispatch_calls == 1U);
              assert(state.marker != nullptr);
              assert(std::strcmp(state.marker, ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>\n") == 0);
              assert(state.message_index == -1);
              assert(state.archive_name != nullptr);
              assert(std::strcmp(state.archive_name, "Image\\Archive\\TitleResource") == 0);
              assert(state.direct_table == 0x01567708U);
              assert(state.direct_count == 24U);
              assert(state.resolved_table == 0U);
              assert(state.resolved_count == 0U);
              assert(state.order_count == 2U);
              assert(state.order[0] == 'L');
              assert(state.order[1] == 'D');

              FUN_00406570_SetServices(nullptr);
          }
          EOF

          cat > decomp/evidence/fun_00406570.md <<'EOF'
          # FUN_00406570 evidence

          ## Target

          - Evidence was taken only from the exact local reference executable; no binary is committed.
          - Reference SHA-256: `323d1aabccc74505745588097e2b298b14e114393bfc24f6830e98b658e67815`.
          - Reference size: 19,977,216 bytes.
          - PE32 x86 image base: `0x00400000`.
          - Function VA `0x00406570`, RVA `0x00006570`.
          - Candidate body: 42 bytes (`0x2A`), through the `ret` at `0x00406599`.
          - Candidate byte SHA-256: `deaac7f2ed937aed2d32fdae42e0407bc84eae9cb009f9bc13c48f8c0269f701`.
          - `0x0040659A..0x0040659F` is `INT3` padding. The separately assigned next candidate begins at `0x004065A0` and is not part of this recovery.

          ## Instruction evidence

          ```text
          00406570  68 EC AF 37 01          push 0x0137AFEC
          00406575  68 00 2E 65 01          push 0x01652E00
          0040657A  E8 C1 29 D9 00          call 0x01198F40
          0040657F  6A 00                   push 0
          00406581  6A 00                   push 0
          00406583  6A 18                   push 0x18
          00406585  68 08 77 56 01          push 0x01567708
          0040658A  68 68 B9 37 01          push 0x0137B968
          0040658F  6A FF                   push -1
          00406591  E8 5A FC FF FF          call 0x004061F0
          00406596  83 C4 20                add esp,0x20
          00406599  C3                      ret
          0040659A  CC                      int3
          0040659B  CC                      int3
          0040659C  CC                      int3
          0040659D  CC                      int3
          0040659E  CC                      int3
          0040659F  CC                      int3
          ```

          The single `add esp,0x20` cleans the two arguments left on the stack for the marker-log call plus all six arguments supplied to `FUN_004061F0`.

          ## Referenced data

          - `0x0137AFEC` = `>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>\n` (46 `>` characters followed by LF).
          - `0x0137B968` = `Image\\Archive\\TitleResource`.
          - `0x01567708` is a 24-entry direct resource table. Each native entry is two 32-bit values: a path pointer and a key/global address.
          - The second table pointer and count passed to `FUN_004061F0` are both zero.
          - The first argument passed to `FUN_004061F0` is exactly `-1`.

          Direct table recovered from the exact reference image:

          | # | path pointer | key/global | path |
          |---:|---:|---:|---|
          | 0 | `0x0137B984` | `0x016E2AB8` | `effect\\efl\\id\\id00\\id0000_cf` |
          | 1 | `0x0137B9A4` | `0x016E2AB8` | `effect\\efl\\id\\id00\\id0001` |
          | 2 | `0x0137B9C0` | `0x016E2AB8` | `effect\\efl\\id\\id00\\id0002` |
          | 3 | `0x0137B9DC` | `0x01692E3C` | `id\\jpn\\title\\top_play00_dc` |
          | 4 | `0x0137B9F8` | `0x016E2758` | `id\\jpn\\title\\top_play00` |
          | 5 | `0x0137BA10` | `0x016E2AE4` | `id\\jpn\\menu\\top00\\model\\title_00` |
          | 6 | `0x0137BA34` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_j` |
          | 7 | `0x0137BA58` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_e` |
          | 8 | `0x0137BA7C` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_g` |
          | 9 | `0x0137BAA0` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_f` |
          | 10 | `0x0137BAC4` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_s` |
          | 11 | `0x0137BAE8` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_i` |
          | 12 | `0x0137BB0C` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_r` |
          | 13 | `0x0137BB30` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_p` |
          | 14 | `0x0137BB54` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_c` |
          | 15 | `0x0137BB78` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_chT` |
          | 16 | `0x0137BBA0` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_01_chS` |
          | 17 | `0x0137BBC8` | `0x016E2D28` | `id\\jpn\\menu\\top01\\motion\\menu` |
          | 18 | `0x0137BBE8` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\title_02` |
          | 19 | `0x0137BC0C` | `0x016E2AE4` | `id\\jpn\\menu\\top01\\model\\cursor_01` |
          | 20 | `0x0137BC30` | `0x016E2D70` | `id\\jpn\\menu\\soft\\menu00` |
          | 21 | `0x0137BC48` | `0x016E2758` | `id\\jpn\\menu\\top01\\top01_light00` |
          | 22 | `0x0137BC68` | `0x01692E3C` | `id\\jpn\\menu\\top26` |
          | 23 | `0x0137B7DC` | `0x01692E3C` | `id\\jpn\\menu\\top30` |

          ## Reconstructed behavior

          1. Emit the fixed `>` marker through native call `0x01198F40`, using global logger/context token `0x01652E00`.
          2. Invoke the already separate `FUN_004061F0` resource-registration helper with exactly:
             - message index `-1`;
             - archive `Image\\Archive\\TitleResource`;
             - direct table `0x01567708` with count `24`;
             - resolved table `nullptr` with count `0`.
          3. Return. There are no native conditional branches or native early returns.

          The portable reconstruction exposes the two side effects through injectable services so tests can verify exact constants, ordering and missing-service safety without dereferencing native absolute addresses. This does not modify or reimplement `FUN_004061F0`.

          ## Tests

          `tests/unit/test_fun_00406570.cpp` verifies:

          - the portable-host null-services early exit;
          - log-only and dispatch-only service configurations;
          - exact marker contents;
          - exact `-1` message index;
          - exact archive literal;
          - direct table token `0x01567708` and count `24`;
          - null/zero resolved table pair;
          - marker logging occurs before resource-group dispatch when both callbacks are present.
          EOF

          python - <<'PY'
          import csv
          from pathlib import Path

          target = 'FUN_00406570'
          claim = 'SEQ-00406570'

          claims = Path('database/claims.csv')
          with claims.open(newline='') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          if any(r['stable_id'] == target and r.get('active', '').lower() == 'true' for r in rows):
              raise SystemExit(f'{target} unexpectedly became claimed')
          rows.append({
              'claim_id': claim,
              'stable_id': target,
              'owner': 'coordinator',
              'branch': 'decomp/00406570-next',
              'task': 'sequential decomp of TitleResource registration wrapper',
              'claimed_at': '2026-09-21T22:45:26Z',
              'expires_at': '',
              'pr': '',
              'active': 'true',
          })
          with claims.open('w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          functions = Path('database/functions.csv')
          with functions.open(newline='') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          if any(r['stable_id'] == target for r in rows):
              raise SystemExit(f'{target} unexpectedly exists in functions.csv')
          rows.append({
              'stable_id': target,
              'va': '0x00406570',
              'rva': '0x00006570',
              'section': '.text',
              'size': '42',
              'provisional_name': target,
              'refined_name': '',
              'workflow_status': 'ACTIVE',
              'confidence': 'HIGH',
              'fast_pass': 'true',
              'fast_pass_validated': 'false',
              'converted': 'false',
              'refined': 'false',
              'verified': 'false',
              'matched': 'false',
              'linked': 'false',
              'calling_convention': 'cdecl',
              'return_type': 'void',
              'arguments': 'void',
              'this_type': '',
              'module': 'UNKNOWN',
              'subsystem': 'Resource',
              'source_file': 'src/recovered/fun_00406570.cpp',
              'owner': 'coordinator',
              'claim_id': claim,
              'pr': '',
              'commit': '',
              'test': 'tests/unit/test_fun_00406570.cpp',
              'evidence': 'decomp/evidence/fun_00406570.md',
              'notes': 'TitleResource registration wrapper with leading marker log and exact -1 message index 24-entry direct table no resolved entries forwarding to FUN_004061F0',
          })
          with functions.open('w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          history = Path('database/history.csv')
          event = 'FUN_00406570,2026-09-22,UNSEEN,FAST_PASS,,coordinator,recovered TitleResource registration wrapper with marker log and exact 24-entry direct table forwarding contract'
          text = history.read_text(encoding='utf-8')
          if event not in text:
              history.write_text(text.rstrip('\n') + '\n' + event + '\n', encoding='utf-8')

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          src_line = '    src/recovered/fun_00406570.cpp\n'
          test_line = '    tests/unit/test_fun_00406570.cpp\n'
          if src_line not in text:
              anchor = '    src/recovered/fun_00406540.cpp\n'
              if anchor not in text:
                  raise SystemExit('CMake source anchor FUN_00406540 missing')
              text = text.replace(anchor, anchor + src_line, 1)
          if test_line not in text:
              anchor = '    tests/unit/test_fun_00406540.cpp\n'
              if anchor not in text:
                  raise SystemExit('CMake test anchor FUN_00406540 missing')
              text = text.replace(anchor, anchor + test_line, 1)
          cmake.write_text(text, encoding='utf-8')

          smoke = Path('tests/unit/test_smoke.cpp')
          text = smoke.read_text(encoding='utf-8')
          if 'void test_fun_00406570();' not in text:
              anchor = 'void test_fun_00406540();\n'
              if anchor not in text:
                  raise SystemExit('smoke declaration anchor FUN_00406540 missing')
              text = text.replace(anchor, anchor + 'void test_fun_00406570();\n', 1)
          if '    test_fun_00406570();' not in text:
              anchor = '    test_fun_00406540();\n'
              if anchor not in text:
                  raise SystemExit('smoke call anchor FUN_00406540 missing')
              text = text.replace(anchor, anchor + '    test_fun_00406570();\n', 1)
          smoke.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate canonical reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py

      - name: Validate metadata and reports
        run: python tools/validate/validate.py

      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev

      - name: Diff hygiene and reject binary products
        shell: bash
        run: |
          git diff --check
          if git diff --name-only HEAD | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then
            echo 'Binary-like file detected' >&2
            exit 1
          fi

      - name: Commit decompilation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/decomp-00406570.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Decompile FUN_00406570 TitleResource registration wrapper'
          git push origin HEAD:decomp/00406570-next
