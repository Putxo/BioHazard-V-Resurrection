name: Promote FUN_00406DB0
on:
  push:
    branches: [promote/00406db0-fastpass-valid]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Promote metadata
        shell: python
        run: |
          from pathlib import Path
          import csv
          p=Path('database/functions.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          h={n:i for i,n in enumerate(rows[0])}
          found=False
          for r in rows[1:]:
              if r and r[0]=='FUN_00406DB0':
                  found=True
                  r[h['fast_pass_validated']]='true'
                  r[h['pr']]='#281'
                  r[h['commit']]='4076aba392ce43cbd9ba03b4fb01f1007f5b281b'
                  suffix='; PR #281 CI 5/5 PASS'
                  if suffix not in r[h['notes']]:
                      r[h['notes']]+=suffix
          assert found
          with p.open('w',newline='') as f: csv.writer(f,lineterminator='\n').writerows(rows)
          p=Path('database/history.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          if not any(r and r[0]=='FUN_00406DB0' and len(r)>3 and r[3]=='FAST_PASS_VALIDATED' for r in rows[1:]):
              rows.append(['FUN_00406DB0','2026-09-23','FAST_PASS','FAST_PASS_VALIDATED',
                           '4076aba392ce43cbd9ba03b4fb01f1007f5b281b','coordinator',
                           'PR #281 completed 5/5 CI checks'])
          with p.open('w',newline='') as f: csv.writer(f,lineterminator='\n').writerows(rows)
      - name: Regenerate reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Validate
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Hygiene
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit promotion and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/promote-00406db0.yml
          git add database/functions.csv database/history.csv reports/functions.json reports/progress-treemap.svg reports/progress.md
          git commit -m 'Validate FUN_00406DB0 fast-pass block'
          git push
