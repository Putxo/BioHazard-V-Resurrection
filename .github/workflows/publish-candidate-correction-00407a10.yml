name: Publish candidate correction 00407A10
on:
  push:
    branches: [release/main-candidate-correction-00407a10]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply validated correction snapshot
        run: |
          git fetch origin integration
          git show 342f58ebe8bd5354165ba7b2ebd98f1d24a54e6f:config/inventory_freeze.json > config/inventory_freeze.json
          git show 342f58ebe8bd5354165ba7b2ebd98f1d24a54e6f:decomp/evidence/candidate_00407a10.md > decomp/evidence/candidate_00407a10.md
          git show 342f58ebe8bd5354165ba7b2ebd98f1d24a54e6f:reports/function-count-audit.md > reports/function-count-audit.md
      - name: Regenerate public reports and adjust README inventory note
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          subprocess.check_call(['python','tools/reports/report.py','--publish-readme'])
          subprocess.check_call(['python','tools/progress/treemap.py'])
          p=Path('README.md')
          s=p.read_text()
          old="> **Foundation and Inventory are validated. The current V6 full-scan candidate baseline contains 79,782 potential function starts. V5's 79,016 fixed-point set is retained as the stricter high-confidence cross-check. Ordered decompilation is active in Phase 14 with one coordinator.**"
          new="> **Foundation and Inventory are validated. The raw V6 full-scan candidate union contains 79,782 potential starts; one evidence-proven jump-table false positive at 0x00407A10 has been removed, so the current dashboard denominator is 79,781. V5's 79,016 fixed-point set is retained as the stricter high-confidence cross-check. Ordered decompilation is active in Phase 14 with one coordinator.**"
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Validate repository
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Hygiene and binary rejection
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit publication and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-candidate-correction-00407a10.yml
          git add README.md config/inventory_freeze.json decomp/evidence/candidate_00407a10.md reports/function-count-audit.md reports/functions.json reports/progress-treemap.svg reports/progress.md
          git commit -m 'Publish 00407A10 candidate correction'
          git push
