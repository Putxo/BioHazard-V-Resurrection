name: Publish FUN_004067E0
on:
  push:
    branches: [release/main-fastpass109-004067e0]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Overlay validated target only
        shell: bash
        run: |
          git fetch origin integration
          git show origin/integration:include/re5/recovered/fun_004067e0.hpp > include/re5/recovered/fun_004067e0.hpp
          git show origin/integration:src/recovered/fun_004067e0.cpp > src/recovered/fun_004067e0.cpp
          git show origin/integration:tests/unit/test_fun_004067e0.cpp > tests/unit/test_fun_004067e0.cpp
          git show origin/integration:decomp/evidence/fun_004067e0.md > decomp/evidence/fun_004067e0.md
      - name: Overlay target metadata and wiring
        shell: python
        run: |
          from pathlib import Path
          import csv, subprocess, io
          def remote_rows(path):
              text=subprocess.check_output(['git','show',f'origin/integration:{path}'],text=True)
              return list(csv.reader(io.StringIO(text)))
          def append_selected(path, key, multiple=False):
              p=Path(path); local=list(csv.reader(p.open(newline=''))); remote=remote_rows(path)
              existing={r[0] for r in local[1:]}
              if multiple:
                  selected=[r for r in remote[1:] if r and r[0]==key]
                  local.extend([r for r in selected if r not in local])
              else:
                  selected=[r for r in remote[1:] if r and r[0]==key]; assert len(selected)==1
                  if key not in existing: local.append(selected[0])
              with p.open('w',newline='') as f: csv.writer(f,lineterminator='\n').writerows(local)
          append_selected('database/functions.csv','FUN_004067E0')
          append_selected('database/claims.csv','SEQ-004067E0')
          append_selected('database/history.csv','FUN_004067E0',True)
          p=Path('CMakeLists.txt'); s=p.read_text()
          if 'src/recovered/fun_004067e0.cpp' not in s:
              s=s.replace('    src/recovered/fun_00406820.cpp\n)', '    src/recovered/fun_00406820.cpp\n    src/recovered/fun_004067e0.cpp\n)')
          if 'tests/unit/test_fun_004067e0.cpp' not in s:
              s=s.replace('    tests/unit/test_fun_00406820.cpp\n)', '    tests/unit/test_fun_00406820.cpp\n    tests/unit/test_fun_004067e0.cpp\n)')
          p.write_text(s)
          p=Path('tests/unit/test_smoke.cpp'); s=p.read_text()
          if 'void test_fun_004067e0();' not in s: s=s.replace('void test_fun_00406820();\n','void test_fun_00406820();\nvoid test_fun_004067e0();\n')
          if '    test_fun_004067e0();' not in s: s=s.replace('    test_fun_00406820();\n    return 0;','    test_fun_00406820();\n    test_fun_004067e0();\n    return 0;')
          p.write_text(s)
      - name: Regenerate public dashboard and validate
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
      - name: Commit publication
        run: |
          rm .github/workflows/release-004067e0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CMakeLists.txt database/claims.csv database/functions.csv database/history.csv decomp/evidence/fun_004067e0.md include/re5/recovered/fun_004067e0.hpp reports/functions.json reports/progress-treemap.svg reports/progress.md src/recovered/fun_004067e0.cpp tests/unit/test_fun_004067e0.cpp tests/unit/test_smoke.cpp
          git commit -m 'Publish validated FUN_004067E0 dashboard'
          git push
