name: prepare-00406600-promotion

on:
  push:
    branches: [promote/00406600-fastpass-valid]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/00406600-fastpass-valid
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote FUN_00406600 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io

          p=Path('database/functions.csv')
          lines=p.read_text().splitlines()
          out=[]; found=False
          for line in lines:
              if line.startswith('FUN_00406600,'):
                  row=next(csv.reader([line]))
                  if len(row) != 30: raise SystemExit(f'unexpected function row fields: {len(row)}')
                  row[10]='true'
                  row[25]='#199'
                  row[26]='e621a22d8b0a03c3a07335092353c68d71446ba5'
                  if 'PR #199 CI 5/5 PASS' not in row[29]:
                      row[29]=row[29].rstrip('; ')+'; PR #199 CI 5/5 PASS'
                  s=io.StringIO(); csv.writer(s,lineterminator='').writerow(row)
                  line=s.getvalue(); found=True
              out.append(line)
          if not found: raise SystemExit('FUN_00406600 functions row missing')
          p.write_text('\n'.join(out)+'\n')

          p=Path('database/history.csv'); t=p.read_text()
          row='FUN_00406600,2026-09-22,FAST_PASS,FAST_PASS_VALIDATED,e621a22d8b0a03c3a07335092353c68d71446ba5,coordinator,PR #199 completed 5/5 CI checks'
          if row not in t: p.write_text(t.rstrip('\n')+'\n'+row+'\n')

          p=Path('decomp/evidence/fun_00406600.md'); t=p.read_text()
          note='\n## Validation promotion\n\nPR #199 completed the standard 5/5 CI suite and merged into `integration` as `e621a22d8b0a03c3a07335092353c68d71446ba5`. The `FAST_PASS_VALIDATED` promotion is based on that exact validated merge.\n'
          if '## Validation promotion' not in t: p.write_text(t.rstrip()+note)
          PY
      - name: Regenerate and validate
        shell: bash
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit promotion
        shell: bash
        run: |
          rm .github/workflows/temp-00406600-promote.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate FUN_00406600 fast-pass block'
          git push origin HEAD:promote/00406600-fastpass-valid
