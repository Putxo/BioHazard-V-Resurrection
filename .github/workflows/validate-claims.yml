name: validate-claims

on:
  push:
  pull_request:

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate/validate.py
      - run: python tools/claims/list_claims.py
