name: materialize-canonical-1000-registration
on:
  push:
    branches: [decomp/canonical-1000]
    paths: [.github/workflows/materialize-canonical-1000.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/canonical-1000
          fetch-depth: 0
      - name: Regenerate exact 1,000-entry registry from integration
        shell: python
        env:
          START_SHA: ${{ github.sha }}
        run: |
          import hashlib,os,pathlib,subprocess,sys
          def run(*a,**k): return subprocess.run(a,check=True,**k)
          def out(*a): return subprocess.check_output(a,text=True).strip()
          assert out('git','rev-parse','HEAD')==os.environ['START_SHA']
          run(sys.executable,'tools/maintenance/canonical_1000.py','register')
          expected={
            'CMakeLists.txt':'5e73ba5aec19d70de0883a5553963508f87a93736fd56cdfb3e3ab8680622668',
            'database/functions.csv':'e9b25755ceb9fe60d6a5fa34a067b3cbce41ff0742d41970d29992ff332730b1',
            'database/claims.csv':'c2946c6e528284014863c5c1c8561baae49adc6417fdbe4bb5239e0e018db8f1',
            'database/history.csv':'88f0de965d10a388e86c7c7f2ef6ff17d86daa8577bb550bf568301286d48094',
            'reports/functions.json':'82f2613ad1ed4940dc69f38f01cc6ea4462ae6c712eaad97493e575248da9ed6',
            'reports/progress.md':'f56126736c1c758fe3f48b695d5c73070fd77fd66f603f4fbaf5ebe3a501caae',
            'reports/progress-treemap.svg':'16482ceb9e523b5b01889f394de00df88e71b5ea0bee78513e2063705c5f6aba',
          }
          for p,h in expected.items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,p
          changed=set(out('git','diff','--name-only').splitlines())
          assert changed==set(expected),(changed,set(expected))
          run('git','rm','.github/workflows/export-canonical-1000-base.yml','.github/workflows/materialize-canonical-1000.yml')
          run('git','diff','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','add','--',*expected)
          run('git','commit','-m','Register 800 existing byte-matched leaves for official canonical 1000')
          remote=out('git','ls-remote','origin','refs/heads/decomp/canonical-1000').split()[0]
          assert remote==os.environ['START_SHA'],'remote branch advanced'
          run('git','push','origin','HEAD:refs/heads/decomp/canonical-1000')
