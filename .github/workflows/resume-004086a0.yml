name: Resume FUN_004086A0
on:
  push:
    branches: [decomp/004086a0-next]
    paths: [.github/workflows/resume-004086a0.yml]
permissions:
  contents: write
concurrency:
  group: resume-004086a0
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Recheck inventories and preserve existing reconstruction
        shell: python
        run: |
          from pathlib import Path
          import csv, io, json, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def content(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)
          original = '5bef52167f35b0a712237a667b42c0f1c1bfc4e5'
          assert git('rev-parse', 'HEAD^') == original, 'Branch moved; inspect before resuming'
          subprocess.run(['git', 'fetch', 'origin', 'main', 'integration'], check=True)
          integration = git('rev-parse', 'origin/integration')
          main = git('rev-parse', 'origin/main')
          Path('/tmp/86a0-integration').write_text(integration)
          Path('/tmp/86a0-main').write_text(main)
          expected = {
              'src/recovered/fun_004086a0.cpp': 'cdc55ffb78fe5cd8bf453b557924d9a584f26128',
              'include/re5/recovered/fun_004086a0.hpp': '131dd268f1adf3a87cc63220ac52f57f3658f2dc',
              'tests/unit/test_fun_004086a0.cpp': '55013b25c8d96e90944c30f445d54c985b4145e2',
              'decomp/evidence/fun_004086a0.md': 'c49d8324ca012bfaf9d48dd5c6b742f348a7cbc3',
          }
          for path, sha in expected.items():
              assert git('rev-parse', f'HEAD:{path}') == sha, path
          for ref in [main, integration]:
              frozen = json.loads(content(ref, 'config/inventory_freeze.json'))
              assert frozen['function_candidate_denominator'] == 79782
              for path in ['database/functions.csv', 'database/claims.csv']:
                  rows = list(csv.DictReader(io.StringIO(content(ref, path))))
                  assert not any('FUN_004086A0' in r.values() for r in rows), (ref, path)
          additions = {}
          for path, key in [('database/functions.csv', 0), ('database/claims.csv', 1), ('database/history.csv', 0)]:
              additions[path] = [line for line in content(original, path).splitlines() if list(csv.reader([line]))[0][key] == 'FUN_004086A0']
              assert len(additions[path]) == 1, (path, additions[path])
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', integration])
          aggregate = {'CMakeLists.txt', 'tests/unit/test_smoke.cpp', *additions, 'reports/functions.json', 'reports/progress.md', 'reports/progress-treemap.svg'}
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').splitlines())
          assert conflicts <= aggregate, f'Unexpected conflicts: {conflicts - aggregate}'
          assert result.returncode == 0 or conflicts
          # Always derive shared files from the current integration snapshot,
          # never from the stale branch copies (notably parallel 00408640).
          for path in aggregate:
              Path(path).write_text(content(integration, path))
          for path, lines in additions.items():
              text = Path(path).read_text()
              Path(path).write_text(text.rstrip('\n') + '\n' + '\n'.join(lines) + '\n')
          p = Path('CMakeLists.txt')
          text = p.read_text()
          for anchor, added in [
              ('    src/recovered/fun_00408640.cpp\n', '    src/recovered/fun_004086a0.cpp\n'),
              ('    tests/unit/test_fun_00408640.cpp\n', '    tests/unit/test_fun_004086a0.cpp\n'),
          ]:
              assert text.count(anchor) == 1 and added not in text
              text = text.replace(anchor, anchor + added)
          p.write_text(text)
          p = Path('tests/unit/test_smoke.cpp')
          text = p.read_text()
          for anchor, added in [
              ('void test_fun_00408640();\n', 'void test_fun_004086a0();\n'),
              ('    test_fun_00408640();\n', '    test_fun_004086a0();\n'),
          ]:
              assert text.count(anchor) == 1 and added not in text
              text = text.replace(anchor, anchor + added)
          p.write_text(text)
          for path, sha in expected.items():
              assert git('hash-object', path) == sha, f'Existing work changed: {path}'
          for path in ['database/functions.csv', 'database/claims.csv', 'database/history.csv']:
              before = content(integration, path).splitlines()
              after = Path(path).read_text().splitlines()
              assert after[:len(before)] == before, f'Parallel rows changed: {path}'
          print('Preflight PASS; main', main, 'integration', integration)
          print('Existing implementation, header, tests and evidence preserved byte-for-byte.')
      - name: Regenerate reports and validate
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
      - name: Build and test complete recovered library
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Record resumption verification and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import os
          integration = Path('/tmp/86a0-integration').read_text()
          main = Path('/tmp/86a0-main').read_text()
          run = os.environ['GITHUB_RUN_ID']
          Path('decomp/evidence/fun_004086a0-resumption.md').write_text(
              '# FUN_004086A0 resumption verification\n\n'
              'Resumed exclusively from `decomp/004086a0-next` at original commit '
              '`5bef52167f35b0a712237a667b42c0f1c1bfc4e5`.\n\n'
              f'- Integration snapshot: `{integration}`.\n'
              f'- Public main snapshot at preflight: `{main}`.\n'
              '- Existing source, header, unit tests and original extraction evidence retained byte-for-byte.\n'
              '- Shared registries and build wiring reconstructed from current integration plus only the target delta.\n'
              '- All pre-existing registry/history rows preserved byte-for-byte.\n'
              '- Canonical denominator remains **79,782**; inventory freeze unchanged.\n'
              '- Full CMake dev build and CTest suite: PASS.\n'
              '- Canonical report generation and metadata validator: PASS.\n'
              f'- Runner log: https://github.com/Putxo/BioHazard-V-Resurrection/actions/runs/{run}\n\n'
              'Separately, the original three C++ file blobs were verified against Git blob hashes '
              'and the isolated original unit test passed with both GCC and Clang, with '
              'AddressSanitizer and UndefinedBehaviorSanitizer enabled. The documented 18-byte '
              'body hash and objdump instruction stream were checked again. The private full EXE '
              'is not available in this resumption environment: its original extraction evidence '
              'is reused, not represented as a fresh full-EXE extraction.\n\n'
              '`fast_pass_validated` remains false until this reconstruction PR actually '
              'completes all five required CI checks. Native code has no conditional branch; '
              'the null-this early return is explicitly portable-only.\n\n'
              'No EXE, DLL, proprietary asset, object file or build product is staged.\n')
          Path('.github/workflows/resume-004086a0.yml').unlink()
      - name: Check isolated diff and fast-forward-only push
        run: |
          git add -u
          git add decomp/evidence/fun_004086a0-resumption.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          from pathlib import Path
          integration = Path('/tmp/86a0-integration').read_text()
          allowed = {'CMakeLists.txt', 'tests/unit/test_smoke.cpp', 'database/functions.csv', 'database/claims.csv', 'database/history.csv', 'reports/functions.json', 'reports/progress.md', 'reports/progress-treemap.svg', 'src/recovered/fun_004086a0.cpp', 'include/re5/recovered/fun_004086a0.hpp', 'tests/unit/test_fun_004086a0.cpp', 'decomp/evidence/fun_004086a0.md', 'decomp/evidence/fun_004086a0-resumption.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', integration], text=True).splitlines())
          assert changed <= allowed, changed - allowed
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          assert not any(p.lower().endswith(('.exe', '.dll', '.obj')) for p in tracked)
          subprocess.run(['git', 'fetch', 'origin', 'integration'], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'origin/integration'], text=True).strip() == integration, 'Integration advanced; rerun from fresh preflight'
          print('Isolated target-only diff and binary hygiene PASS')
          PY
          git commit -m 'Resume FUN_004086A0 with current integration and validated original tests'
          git push origin HEAD:refs/heads/decomp/004086a0-next
