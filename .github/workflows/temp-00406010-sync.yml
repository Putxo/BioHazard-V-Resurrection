name: sync-00406010-integration

on:
  push:
    branches: [decomp/00406010-next]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current integration and reapply only FUN_00406010 shared metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin integration
          git merge --no-commit --no-ff -X theirs origin/integration
          python - <<'PY'
          from pathlib import Path
          import csv

          p = Path('CMakeLists.txt')
          text = p.read_text(encoding='utf-8')
          src_line = '    src/recovered/fun_00406010.cpp\n'
          if src_line not in text:
              anchor = '    src/recovered/fun_00405930.cpp\n'
              if anchor not in text:
                  anchor = '    src/recovered/fun_00405df0.cpp\n'
              if anchor not in text: raise SystemExit('source anchor missing')
              text = text.replace(anchor, anchor + src_line, 1)
          test_line = '    tests/unit/test_fun_00406010.cpp\n'
          if test_line not in text:
              anchor = '    tests/unit/test_fun_00405930.cpp\n'
              if anchor not in text:
                  anchor = '    tests/unit/test_fun_00405df0.cpp\n'
              if anchor not in text: raise SystemExit('test anchor missing')
              text = text.replace(anchor, anchor + test_line, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/unit/test_smoke.cpp')
          text = p.read_text(encoding='utf-8')
          decl = 'void test_fun_00406010();\n'
          if decl not in text:
              anchor = 'void test_fun_00405930();\n'
              if anchor not in text: anchor = 'void test_fun_00405df0();\n'
              if anchor not in text: raise SystemExit('smoke decl anchor missing')
              text = text.replace(anchor, anchor + decl, 1)
          call = '    test_fun_00406010();\n'
          if call not in text:
              anchor = '    test_fun_00405930();\n'
              if anchor not in text: anchor = '    test_fun_00405df0();\n'
              if anchor not in text: raise SystemExit('smoke call anchor missing')
              text = text.replace(anchor, anchor + call, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('database/claims.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          rows = [r for r in rows if r.get('stable_id') != 'FUN_00406010']
          rows.append({'claim_id':'SEQ-00406010','stable_id':'FUN_00406010','owner':'coordinator','branch':'decomp/00406010-next','task':'sequential decomp of recursive convertDir resource walker','claimed_at':'2026-09-21T22:04:00Z','expires_at':'','pr':'','active':'true'})
          with p.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p = Path('database/functions.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          rows = [r for r in rows if r.get('stable_id') != 'FUN_00406010']
          rows.append({'stable_id':'FUN_00406010','va':'0x00406010','rva':'0x00006010','section':'.text','size':'467','provisional_name':'FUN_00406010','refined_name':'','workflow_status':'ACTIVE','confidence':'HIGH','fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false','verified':'false','matched':'false','linked':'false','calling_convention':'cdecl','return_type':'void','arguments':'const char* base_path; const char* key; const char* extension','this_type':'void','module':'UNKNOWN','subsystem':'Resource','source_file':'src/recovered/fun_00406010.cpp','owner':'coordinator','claim_id':'SEQ-00406010','pr':'','commit':'','test':'tests/unit/test_fun_00406010.cpp','evidence':'decomp/evidence/fun_00406010.md','notes':'recursive convertDir resource walker with wildcard scan dot-entry filtering extension-token truncation resolve/create suppressor gates and registration sink'})
          with p.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p = Path('database/history.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f)); fields = list(rows[0].keys())
          rows = [r for r in rows if not (r.get('stable_id') == 'FUN_00406010' and r.get('new_status') == 'FAST_PASS')]
          rows.append({'stable_id':'FUN_00406010','date':'2026-09-22','old_status':'UNSEEN','new_status':'FAST_PASS','commit':'','owner':'coordinator','reason':'recovered recursive convertDir walker with extension-token filtering and suppressor-aware registration'})
          with p.open('w', newline='', encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Regenerate and validate combined tree
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit synchronized candidate
        shell: bash
        run: |
          rm .github/workflows/temp-00406010-sync.yml
          git add CMakeLists.txt tests/unit/test_smoke.cpp database/claims.csv database/functions.csv database/history.csv reports/ .github/workflows/temp-00406010-sync.yml
          git commit -m 'Sync FUN_00406010 candidate with latest integration'
          git push origin HEAD:decomp/00406010-next
