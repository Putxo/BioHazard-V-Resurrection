name: Publish FUN_004067A0
on:
  push:
    branches: [release/main-fastpass105-004067a0]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply validated FUN_004067A0 snapshot
        shell: bash
        run: |
          git checkout 5b4da696aa8bd33bf291cf306b3e9115d2641c32 -- \
            include/re5/recovered/fun_004067a0.hpp \
            src/recovered/fun_004067a0.cpp \
            tests/unit/test_fun_004067a0.cpp \
            decomp/evidence/fun_004067a0.md
      - name: Merge target metadata and wiring only
        shell: python
        run: |
          from pathlib import Path
          import csv, subprocess, io

          snap='5b4da696aa8bd33bf291cf306b3e9115d2641c32'
          def snap_rows(path):
              txt=subprocess.check_output(['git','show',f'{snap}:{path}'], text=True)
              return list(csv.reader(io.StringIO(txt)))
          def merge_target(path, key, value):
              p=Path(path)
              with p.open(newline='') as f: cur=list(csv.reader(f))
              src=snap_rows(path)
              hdr=cur[0]; idx={k:i for i,k in enumerate(hdr)}
              sidx={k:i for i,k in enumerate(src[0])}
              target=[r for r in src[1:] if r[sidx[key]]==value]
              assert target
              cur=[cur[0]]+[r for r in cur[1:] if r[idx[key]]!=value]
              cur.extend(target)
              with p.open('w', newline='') as f: csv.writer(f, lineterminator='\n').writerows(cur)
          merge_target('database/functions.csv','stable_id','FUN_004067A0')
          merge_target('database/claims.csv','stable_id','FUN_004067A0')

          p=Path('database/history.csv')
          with p.open(newline='') as f: cur=list(csv.reader(f))
          src=snap_rows('database/history.csv')
          cur=[cur[0]]+[r for r in cur[1:] if r and r[0]!='FUN_004067A0']
          cur.extend([r for r in src[1:] if r and r[0]=='FUN_004067A0'])
          with p.open('w', newline='') as f: csv.writer(f, lineterminator='\n').writerows(cur)

          p=Path('CMakeLists.txt'); s=p.read_text()
          if 'src/recovered/fun_004067a0.cpp' not in s:
              s=s.replace('    src/recovered/fun_00406780.cpp\n)', '    src/recovered/fun_00406780.cpp\n    src/recovered/fun_004067a0.cpp\n)')
          if 'tests/unit/test_fun_004067a0.cpp' not in s:
              s=s.replace('    tests/unit/test_fun_00406780.cpp\n)', '    tests/unit/test_fun_00406780.cpp\n    tests/unit/test_fun_004067a0.cpp\n)')
          p.write_text(s)

          p=Path('tests/unit/test_smoke.cpp'); s=p.read_text()
          if 'void test_fun_004067a0();' not in s:
              s=s.replace('void test_fun_00406780();\n', 'void test_fun_00406780();\nvoid test_fun_004067a0();\n')
          if '    test_fun_004067a0();' not in s:
              s=s.replace('    test_fun_00406780();\n    return 0;', '    test_fun_00406780();\n    test_fun_004067a0();\n    return 0;')
          p.write_text(s)
      - name: Regenerate public reports
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
      - name: Validate
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Diff hygiene and binary rejection
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit publication and remove helper
        run: |
          rm .github/workflows/publish-004067a0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md database/claims.csv database/functions.csv database/history.csv decomp/evidence/fun_004067a0.md include/re5/recovered/fun_004067a0.hpp reports/functions.json reports/progress-treemap.svg reports/progress.md src/recovered/fun_004067a0.cpp tests/unit/test_fun_004067a0.cpp tests/unit/test_smoke.cpp
          git commit -m 'Publish FUN_004067A0 fast-pass dashboard [publish-004067a0]'
          git push
