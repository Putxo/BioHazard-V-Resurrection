name: assemble-00401860-temp
on:
  push:
    branches:
      - decomp/00401860-sequential
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00401860-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          claims = Path('database/claims.csv')
          with claims.open('a', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerow([
                  'SEQ-00401860','FUN_00401860','coordinator','decomp/00401860-sequential',
                  'sequential decomp of SteamUser-backed virtual slot +0x04 helper',
                  '2026-09-10T14:52:00Z','','','true'])

          history = Path('database/history.csv')
          with history.open('a', newline='', encoding='utf-8') as f:
              csv.writer(f, lineterminator='\n').writerow([
                  'FUN_00401860','2026-09-10','UNSEEN','FAST_PASS','','coordinator',
                  'recovered null-guarded one-argument virtual slot +0x04 dispatch; direct caller passes SteamUser()'])

          functions = Path('database/functions.csv')
          with functions.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          if any(r['stable_id'] == 'FUN_00401860' for r in rows):
              raise SystemExit('FUN_00401860 already present')
          row = {k: '' for k in fields}
          row.update({
              'stable_id':'FUN_00401860','va':'0x00401860','rva':'0x00001860','section':'.text','size':'18',
              'provisional_name':'FUN_00401860','workflow_status':'ACTIVE','confidence':'HIGH',
              'fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false',
              'verified':'false','matched':'false','linked':'false','calling_convention':'cdecl','return_type':'bool',
              'arguments':'void* object','module':'UNKNOWN','subsystem':'UNKNOWN',
              'source_file':'src/recovered/fun_00401860.cpp','owner':'coordinator','claim_id':'SEQ-00401860',
              'test':'tests/unit/test_fun_00401860.cpp','evidence':'decomp/evidence/fun_00401860.md',
              'notes':'null-guarded virtual slot +0x04 forwarding helper; direct caller passes SteamUser()'
          })
          rows.append(row)
          with functions.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/assemble-00401860-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/claims.csv database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Assemble FUN_00401860 fast pass metadata'
          git push origin HEAD:decomp/00401860-sequential
