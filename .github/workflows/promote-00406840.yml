name: Promote FUN_00406840
on:
  push:
    branches: [promote/00406840-fastpass-valid]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote metadata
        shell: python
        run: |
          from pathlib import Path
          import csv

          p=Path('database/functions.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          header=rows[0]
          ix={name:i for i,name in enumerate(header)}
          found=False
          for row in rows[1:]:
              if row and row[0]=='FUN_00406840':
                  found=True
                  row[ix['fast_pass_validated']]='true'
                  row[ix['pr']]='#254'
                  row[ix['commit']]='b0f0b97ba37b698442aa4f633d25d0224ff7e4df'
                  note=row[ix['notes']]
                  suffix='; PR #254 CI 5/5 PASS'
                  if suffix not in note:
                      row[ix['notes']]=note+suffix
          assert found
          with p.open('w',newline='') as f: csv.writer(f,lineterminator='\n').writerows(rows)

          p=Path('database/history.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          if not any(r and r[0]=='FUN_00406840' and len(r)>3 and r[3]=='FAST_PASS_VALIDATED' for r in rows[1:]):
              rows.append(['FUN_00406840','2026-09-23','FAST_PASS','FAST_PASS_VALIDATED',
                           'b0f0b97ba37b698442aa4f633d25d0224ff7e4df','coordinator',
                           'PR #254 completed 5/5 CI checks'])
          with p.open('w',newline='') as f: csv.writer(f,lineterminator='\n').writerows(rows)
      - name: Regenerate reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Validate
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Hygiene
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit promotion and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/promote-00406840.yml
          git add database/functions.csv database/history.csv reports/functions.json reports/progress-treemap.svg reports/progress.md
          git commit -m 'Validate FUN_00406840 fast-pass block'
          git push
