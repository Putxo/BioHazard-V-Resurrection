name: fix-00405df0-metadata

on:
  push:
    branches: [decomp/00405df0-next]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[fix-00405df0]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00405df0-next
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair exact CSV row boundary
        shell: python
        run: |
          from pathlib import Path
          p = Path('database/functions.csv')
          text = p.read_text(encoding='utf-8')
          marker = 'FUN_00405DF0,0x00405DF0,'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('FUN_00405DF0 row missing')
          if pos > 0 and text[pos - 1] != '\n':
              text = text[:pos] + '\n' + text[pos:]
          p.write_text(text, encoding='utf-8')
      - name: Regenerate and validate canonical outputs
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          cmake -S . -B build
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/fix-00405df0-metadata.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/functions.csv reports/ .github/workflows/fix-00405df0-metadata.yml
          git commit -m 'Fix FUN_00405DF0 metadata row boundary [fix-00405df0]'
          git push origin HEAD:decomp/00405df0-next
