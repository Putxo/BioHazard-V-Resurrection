name: promote-00401650-temp
on:
  push:
    branches: [decomp/00401650-sequential, decomp/promote-00401650-ci]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/promote-00401650-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote metadata and regenerate reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('database/functions.csv')
          with path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = reader.fieldnames
          for row in rows:
              if row['stable_id'] == 'FUN_00401650':
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#60'
                  row['commit'] = '7e1e0ceb90a6b6c0ea952aa4e10b10529aea6815'
                  row['notes'] = 'SteamUserStats virtual slot +0x54 forwarding helper; PR #60 CI 5/5 PASS'
                  break
          else:
              raise SystemExit('FUN_00401650 not found')
          with path.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          hist = Path('database/history.csv')
          line = 'FUN_00401650,2026-09-10,FAST_PASS,FAST_PASS_VALIDATED,7e1e0ceb90a6b6c0ea952aa4e10b10529aea6815,coordinator,PR #60 completed 5/5 CI checks\n'
          text = hist.read_text(encoding='utf-8')
          if line not in text:
              hist.write_text(text + line, encoding='utf-8')
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          rm .github/workflows/promote-00401650-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg .github/workflows/promote-00401650-temp.yml
          git commit -m 'Promote FUN_00401650 after PR #60 CI'
          git push origin HEAD:decomp/promote-00401650-ci
