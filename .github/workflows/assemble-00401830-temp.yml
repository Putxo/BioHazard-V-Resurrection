name: assemble-00401830-temp
on:
  push:
    branches:
      - decomp/00401830-sequential
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00401830-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          fpath=Path('database/functions.csv')
          with fpath.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          if not any(r['stable_id']=='FUN_00401830' for r in rows):
              row={k:'' for k in fields}
              row.update({'stable_id':'FUN_00401830','va':'0x00401830','rva':'0x00001830','section':'.text','size':'47','provisional_name':'FUN_00401830','workflow_status':'ACTIVE','confidence':'HIGH','fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false','verified':'false','matched':'false','linked':'false','calling_convention':'cdecl','return_type':'bool','arguments':'const uint8_t* first; const uint8_t* second; uint32_t length','module':'UNKNOWN','subsystem':'UNKNOWN','source_file':'src/recovered/fun_00401830.cpp','owner':'coordinator','claim_id':'SEQ-00401830','test':'tests/unit/test_fun_00401830.cpp','evidence':'decomp/evidence/fun_00401830.md','notes':'three-argument byte-range equality helper; zero length true and first mismatch false'})
              rows.append(row)
              with fpath.open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          cpath=Path('database/claims.csv')
          with cpath.open(newline='',encoding='utf-8') as f: claims=list(csv.reader(f))
          if not any(r and r[0]=='SEQ-00401830' for r in claims[1:]):
              with cpath.open('a',newline='',encoding='utf-8') as f:
                  csv.writer(f,lineterminator='\n').writerow(['SEQ-00401830','FUN_00401830','coordinator','decomp/00401830-sequential','sequential decomp of exact byte-range equality flow','2026-09-10T13:45:00Z','','','true'])
          hpath=Path('database/history.csv')
          with hpath.open(newline='',encoding='utf-8') as f: hist=list(csv.reader(f))
          if not any(r and r[0]=='FUN_00401830' for r in hist[1:]):
              with hpath.open('a',newline='',encoding='utf-8') as f:
                  csv.writer(f,lineterminator='\n').writerow(['FUN_00401830','2026-09-10','UNSEEN','FAST_PASS','','coordinator','recovered exact three-argument byte-range equality helper'])
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/assemble-00401830-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/claims.csv database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Assemble FUN_00401830 fast pass metadata'
          git push origin HEAD:decomp/00401830-sequential
