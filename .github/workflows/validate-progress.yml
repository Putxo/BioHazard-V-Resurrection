name: validate-progress

on:
  push:
  pull_request:

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate progress
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Generated files must already be synchronized
        run: git diff --exit-code -- README.md reports/
