name: Finalize FUN_00405930 branch

on:
  push:
    branches:
      - decomp/00405930-next

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add FUN_00405930 metadata only
        shell: python
        run: |
          from pathlib import Path

          functions = Path('database/functions.csv')
          text = functions.read_text(encoding='utf-8')
          row = "FUN_00405930,0x00405930,0x00005930,.text,304,FUN_00405930,,ACTIVE,HIGH,true,false,false,false,false,false,false,thiscall,bool,FUN_00405930_Object& object,FUN_00405930_Object*,UNKNOWN,Resource,src/recovered/fun_00405930.cpp,coordinator,SEQ-00405930,,,tests/unit/test_fun_00405930.cpp,decomp/evidence/fun_00405930.md,three-state node conversion worker with counted table allocation convert-message submission FUN_00405710 processing and early completion cleanup"
          if 'FUN_00405930,' not in text:
              lines = text.rstrip('\n').split('\n')
              pos = next(i + 1 for i, line in enumerate(lines) if line.startswith('FUN_00405710,'))
              lines.insert(pos, row)
              functions.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          claims = Path('database/claims.csv')
          text = claims.read_text(encoding='utf-8')
          claim = "SEQ-00405930,FUN_00405930,coordinator,decomp/00405930-next,sequential decomp of three-state node conversion worker,2026-09-21T21:00:00Z,,,true"
          if 'SEQ-00405930,' not in text:
              claims.write_text(text.rstrip('\n') + '\n' + claim + '\n', encoding='utf-8')

          history = Path('database/history.csv')
          text = history.read_text(encoding='utf-8')
          event = "FUN_00405930,2026-09-21,UNSEEN,FAST_PASS,,coordinator,recovered three-state node conversion worker with allocation and early-return coverage"
          if event not in text:
              history.write_text(text.rstrip('\n') + '\n' + event + '\n', encoding='utf-8')

      - name: Regenerate canonical reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py

      - name: Validate metadata and reports
        run: python tools/validate/validate.py

      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Diff hygiene
        run: git diff --check

      - name: Commit generated metadata and reports, then remove temporary workflow
        run: |
          rm .github/workflows/regenerate-00405930.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize FUN_00405930 metadata and reports"
          git push origin HEAD:decomp/00405930-next
