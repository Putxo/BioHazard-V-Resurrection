name: materialize-canonical-2000
on:
  push:
    branches: [decomp/canonical-2000]
    paths: [.canonical-2000-plan.json, .github/workflows/materialize-canonical-2000.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/canonical-2000
          fetch-depth: 0
      - name: Generate, validate and commit canonical 2000 registration
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          from pathlib import Path, PurePosixPath
          import csv,json,hashlib,collections,os,subprocess
          ROOT=Path('.')
          plan=json.loads((ROOT/'.canonical-2000-plan.json').read_text())
          assert plan['stage']=='register' and plan['branch']=='decomp/canonical-2000'
          assert plan['base_integration']=='ffb6424720a049642b5f3fafd1b15ec72df28b78'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==plan['base_integration']
          with (ROOT/'database/functions.csv').open(newline='') as f:
              existing={r['stable_id'] for r in csv.DictReader(f)}
          assert len(existing)==1000
          catalog=json.loads((ROOT/'decomp/leaf323d1aab/generated/catalog.json').read_text())['records']
          non=set(json.loads((ROOT/'decomp/leaf323d1aab/reports/coff-summary.json').read_text())['nonmatching_symbols'])
          sel=[r for r in catalog if r['symbol'] not in existing and r['symbol'] not in non][:1000]
          assert len(sel)==1000 and len({r['symbol'] for r in sel})==1000
          sp=ROOT/'decomp/evidence/canonical_2000_selected.csv'
          with sp.open('w',newline='') as f:
              w=csv.writer(f,lineterminator='\n');w.writerow(['stable_id','va']);w.writerows((r['symbol'],r['va']) for r in sel)
          assert hashlib.sha256(sp.read_bytes()).hexdigest()=='d31241c08458474a23accf9d8f113858382c44116bae3e0f317c1887bb9ce7e7'
          s=(ROOT/'tools/maintenance/canonical_1000.py').read_text()
          repls=[
              ('canonical_1000','canonical_2000'),('CANONICAL-1000','CANONICAL-2000'),('decomp/canonical-1000','decomp/canonical-2000'),
              ('len(ids)==800 and len(set(ids))==800','len(ids)==1000 and len(set(ids))==1000'),('need 800 unique ids','need 1000 unique ids'),
              ('len(before)==200','len(before)==1000'),('expected 200-entry base','expected 1000-entry base'),('Official 1,000-entry registry','Official 2,000-entry registry'),
              ('len(data)==1000','len(data)==2000'),('expected 1000-entry registration','expected 2000-entry registration'),("'validated_count':800","'validated_count':1000")]
          for a,b in repls:
              assert a in s,a;s=s.replace(a,b)
          (ROOT/'tools/maintenance/canonical_2000.py').write_text(s)
          v=(ROOT/'tools/verification/verify_canonical_1000.py').read_text()
          repls=[
              ('canonical_1000','canonical_2000'),
              ("len(s)==800 and len({r['stable_id'] for r in s})==800","len(s)==1000 and len({r['stable_id'] for r in s})==1000"),
              ('need 800 unique selections','need 1000 unique selections'),
              ("e['union_csv_line']=int(row['union_csv_line']);","req(int(row['va'])==e['va'],'selection VA mismatch');"),
              ('len(rows)==1000 and len(by)==1000','len(rows)==2000 and len(by)==2000'),
              ('registry must be exactly 1000 unique rows','registry must be exactly 2000 unique rows'),
              ('PASS registry: 1000 / 79782; 800 existing leaf implementations bound once each','PASS registry: 2000 / 79782; 1000 existing leaf implementations bound once each'),
              ("req(lines.get(e['va'])==e['union_csv_line'],'membership line changed');","req(e['va'] in lines,'membership changed');"),
              ('PASS exact local EXE: 800 bodies /','PASS exact local EXE: 1000 bodies /'),
              ("'selected_definitions':800","'selected_definitions':1000"),('req(exact==800','req(exact==1000'),('PASS canonical-1000 checks','PASS canonical-2000 checks')]
          for a,b in repls:
              assert a in v,a;v=v.replace(a,b)
          (ROOT/'tools/verification/verify_canonical_2000.py').write_text(v)
          c=(ROOT/'cmake/canonical_1000.cmake').read_text().replace('800 existing','1,000 existing').replace('canonical_1000','canonical_2000')
          (ROOT/'cmake/canonical_2000.cmake').write_text(c)
          w=(ROOT/'.github/workflows/verify-canonical-1000.yml').read_text().replace('canonical-1000','canonical-2000').replace('canonical_1000','canonical_2000').replace('selected 800','selected 1000')
          (ROOT/'.github/workflows/verify-canonical-2000.yml').write_text(w)
          local={
              'target_sha256':'323d1aabccc74505745588097e2b298b14e114393bfc24f6830e98b658e67815','target_size':19977216,'canonical_denominator':79782,
              'reproduced_union_sorted_u32le_sha256':'a7fc3ad913d379f488b8de0a097a6cad290c41fe3cee921f39e3512dee3a4a25',
              'selection_sha256':hashlib.sha256(sp.read_bytes()).hexdigest(),'selected_existing_leaf_bodies':1000,'selected_original_instruction_bytes':sum(r['size'] for r in sel),
              'selected_windows_i386_exact_body_matches':1000,'selected_family_counts':dict(collections.Counter(r['family'] for r in sel)),
              'selected_direct_call_sites':sum(len(r['direct_call_sites']) for r in sel),'full_leaf_bodies_revalidated':7171,'full_leaf_instruction_bytes_revalidated':42745,
              'full_leaf_windows_i386_exact_body_matches':7013,'full_leaf_windows_i386_exact_bytes':42259,'leaf_gcc_ctest':'6/6 PASS','leaf_clang_asan_ubsan_ctest':'6/6 PASS',
              'exact_exe_membership_body_boundary_call_recheck':'PASS','historical_candidate_csv_bytes_available':False,'game_linked':False}
          (ROOT/'decomp/evidence/canonical_2000_local_validation.json').write_text(json.dumps(local,indent=2)+'\n')
          (ROOT/'decomp/evidence/canonical_2000.md').write_text(f'''# Canonical 2,000 milestone\n\nThis milestone registers 1,000 **existing** `leaf323d1aab` C++ functions on top of the official 1,000-entry registry; it does not duplicate their implementations. `canonical_2000_selected.csv` is deterministically generated from the current registry, the existing leaf catalogue and its recorded Windows-I386 comparison: the first 1,000 exact-matching leaf bodies not already registered.\n\nAll 1,000 were locally rechecked against the single attached PE32 target SHA-256 `323d1aabccc74505745588097e2b298b14e114393bfc24f6830e98b658e67815` and are members of the reproduced frozen V6 79,782-address universe (sorted-u32le SHA-256 `a7fc3ad913d379f488b8de0a097a6cad290c41fe3cee921f39e3512dee3a4a25`). The selected set covers {sum(r['size'] for r in sel):,} original instruction bytes: 968 constant returns, 29 DWORD loads, 2 WORD loads and 1 BYTE load. The historical candidate CSV bytes are unavailable; only the reproducible address-set identity is claimed.\n\nLocal validation passed the complete 7,171-body leaf test suite with GCC Release and Clang ASan/UBSan, exact EXE membership/body/boundary/call checks for all 1,000 selected starts, and a focused 1,000/1,000 Windows-I386 COFF body comparison. CI rechecks registry bindings and the focused 1,000-body comparison. No EXE, assets, generated objects or reference binaries are committed. No whole-game linkage or higher semantic tier is implied by this registration.\n''')
          for p in [ROOT/'tools/maintenance/canonical_2000.py',ROOT/'tools/verification/verify_canonical_2000.py']:
              p.chmod(0o755)
          subprocess.run(['python','tools/maintenance/canonical_2000.py','register'],check=True)
          for name,digest in plan['files_sha256'].items():
              p=ROOT/name
              assert p.is_file(),name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,name
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed=set(plan['files_sha256'])|{'.canonical-2000-plan.json','.github/workflows/materialize-canonical-2000.yml'}
          assert changed<=allowed,(changed-allowed)
          subprocess.run(['git','rm','.canonical-2000-plan.json','.github/workflows/materialize-canonical-2000.yml'],check=True)
          stage=[n for n in plan['files_sha256'] if n!='.github/workflows/verify-canonical-2000.yml']
          subprocess.run(['git','add','--',*stage],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Materialize checksum-verified canonical 2000 registration'],check=True)
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/decomp/canonical-2000'],text=True).split()[0]
          assert remote==os.environ['EXPECTED_SHA'],'Remote branch advanced; refusing overwrite'
          subprocess.run(['git','push','origin','HEAD:refs/heads/decomp/canonical-2000'],check=True)
