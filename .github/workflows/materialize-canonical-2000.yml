name: materialize-canonical-2000
on:
  push:
    branches: [promote/canonical-2000]
    paths:
      - .github/workflows/materialize-canonical-2000.yml
      - .canonical-2000-plan.json
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Promote exactly the validated canonical-2000 selection
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          import csv,json,os,pathlib,subprocess,sys
          root=pathlib.Path('.')
          p=json.loads((root/'.canonical-2000-plan.json').read_text())
          assert p['stage']=='promote'
          assert p['branch']=='promote/canonical-2000'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_SHA']
          cmd=[sys.executable,'tools/maintenance/canonical_2000.py','promote',
               '--recovery-pr',str(p['recovery_pr']),
               '--recovery-head',p['recovery_head'],
               '--recovery-merge',p['recovery_merge']]
          subprocess.run(cmd,check=True)
          rows=list(csv.DictReader((root/'database/functions.csv').open()))
          assert len(rows)==2000 and len({r['stable_id'] for r in rows})==2000
          selected={r['stable_id'] for r in csv.DictReader((root/'decomp/evidence/canonical_2000_selected.csv').open())}
          assert len(selected)==1000
          by={r['stable_id']:r for r in rows}
          assert all(by[s]['fast_pass']=='true' and by[s]['fast_pass_validated']=='true' for s in selected)
          assert sum(r['fast_pass_validated']=='true' for r in rows)==1987
          allowed={
            'database/functions.csv','database/history.csv',
            'decomp/evidence/canonical_2000_promotion.json',
            'reports/functions.json','reports/progress.md','reports/progress-treemap.svg'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed and changed<=allowed,(changed-allowed)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Promote canonical 2000 selection after recovery CI'],check=True)
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/promote/canonical-2000'],text=True).split()[0]
          assert remote==os.environ['EXPECTED_SHA'],'branch advanced unexpectedly'
          subprocess.run(['git','push','origin','HEAD:refs/heads/promote/canonical-2000'],check=True)
