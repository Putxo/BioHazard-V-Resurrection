name: prepare-00406540-promotion

on:
  push:
    branches:
      - promote/00406540-fastpass-valid

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/00406540-fastpass-valid
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Promote FUN_00406540 metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv

          path = Path('database/functions.csv')
          with path.open(newline='') as f:
              rows = list(csv.reader(f))
          header = rows[0]
          idx = {name: i for i, name in enumerate(header)}
          found = False
          for row in rows[1:]:
              if row and row[0] == 'FUN_00406540':
                  found = True
                  row[idx['fast_pass']] = 'true'
                  row[idx['fast_pass_validated']] = 'true'
                  row[idx['pr']] = '#184'
                  row[idx['commit']] = '90444724ef6040379b990c1c6c4116bf910bd0a0'
                  note = row[idx['notes']]
                  suffix = 'PR #184 CI 5/5 PASS'
                  if suffix not in note:
                      row[idx['notes']] = (note + '; ' + suffix) if note else suffix
                  break
          if not found:
              raise SystemExit('FUN_00406540 missing from database/functions.csv')
          with path.open('w', newline='') as f:
              csv.writer(f, lineterminator='\n').writerows(rows)

          hpath = Path('database/history.csv')
          with hpath.open(newline='') as f:
              hrows = list(csv.reader(f))
          if not any(len(r) >= 4 and r[0] == 'FUN_00406540' and r[2] == 'FAST_PASS' and r[3] == 'FAST_PASS_VALIDATED' for r in hrows[1:]):
              hrows.append([
                  'FUN_00406540', '2026-09-22', 'FAST_PASS', 'FAST_PASS_VALIDATED',
                  '90444724ef6040379b990c1c6c4116bf910bd0a0', 'coordinator',
                  'PR #184 completed 5/5 CI checks'
              ])
              with hpath.open('w', newline='') as f:
                  csv.writer(f, lineterminator='\n').writerows(hrows)
          PY

      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev

      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-00406540-promote.yml
          git add -A
          git commit -m "Validate FUN_00406540 fast-pass block"
          git push origin HEAD:promote/00406540-fastpass-valid
