name: Publish FUN_00407AF0
on:
  push:
    branches: [release/main-fastpass121-00407af0]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply validated target snapshot
        run: |
          git fetch origin integration
          git show a4ff26edbd23f37a0009aa12e691c5c3699ad8f8:include/re5/recovered/fun_00407af0.hpp > include/re5/recovered/fun_00407af0.hpp
          git show a4ff26edbd23f37a0009aa12e691c5c3699ad8f8:src/recovered/fun_00407af0.cpp > src/recovered/fun_00407af0.cpp
          git show a4ff26edbd23f37a0009aa12e691c5c3699ad8f8:tests/unit/test_fun_00407af0.cpp > tests/unit/test_fun_00407af0.cpp
          git show a4ff26edbd23f37a0009aa12e691c5c3699ad8f8:decomp/evidence/fun_00407af0.md > decomp/evidence/fun_00407af0.md
      - name: Merge only FUN_00407AF0 metadata and wiring
        shell: python
        run: |
          from pathlib import Path
          import csv, io, subprocess
          snap='a4ff26edbd23f37a0009aa12e691c5c3699ad8f8'
          def show(path):
              return subprocess.check_output(['git','show',f'{snap}:{path}'],text=True)
          def merge_rows(path,pred):
              p=Path(path)
              with p.open(newline='') as f: cur=list(csv.reader(f))
              src=list(csv.reader(io.StringIO(show(path))))
              assert cur[0]==src[0]
              picked=[r for r in src[1:] if pred(r)]
              assert picked
              kept=[r for r in cur[1:] if not pred(r)]
              with p.open('w',newline='') as f:
                  csv.writer(f,lineterminator='\n').writerows([cur[0]]+kept+picked)
          merge_rows('database/functions.csv',lambda r:r and r[0]=='FUN_00407AF0')
          merge_rows('database/claims.csv',lambda r:len(r)>1 and r[1]=='FUN_00407AF0')
          merge_rows('database/history.csv',lambda r:r and r[0]=='FUN_00407AF0')

          p=Path('CMakeLists.txt'); s=p.read_text()
          if 'src/recovered/fun_00407af0.cpp' not in s:
              marker=')\ntarget_include_directories(re5_recovered PUBLIC include)'
              assert marker in s
              s=s.replace(marker,'    src/recovered/fun_00407af0.cpp\n'+marker,1)
          if 'tests/unit/test_fun_00407af0.cpp' not in s:
              marker=')\ntarget_link_libraries(re5_tests PRIVATE re5_recovered)'
              assert marker in s
              s=s.replace(marker,'    tests/unit/test_fun_00407af0.cpp\n'+marker,1)
          p.write_text(s)

          p=Path('tests/unit/test_smoke.cpp'); s=p.read_text()
          if 'void test_fun_00407af0();' not in s:
              marker='\nint main() {'
              assert marker in s
              s=s.replace(marker,'\nvoid test_fun_00407af0();'+marker,1)
          if '    test_fun_00407af0();' not in s:
              marker='    return 0;\n}'
              assert marker in s
              s=s.replace(marker,'    test_fun_00407af0();\n'+marker,1)
          p.write_text(s)
      - name: Regenerate public reports and normalize inventory banner
        shell: python
        run: |
          import json,re,subprocess
          from pathlib import Path
          subprocess.check_call(['python','tools/reports/report.py','--publish-readme'])
          subprocess.check_call(['python','tools/progress/treemap.py'])
          inv=json.loads(Path('config/inventory_freeze.json').read_text())
          corr=inv.get('classified_false_positive_corrections',{})
          count=int(corr.get('count',0))
          den=int(inv['function_candidate_denominator'])
          excluded=', '.join(corr.get('excluded_vas',[]))
          p=Path('README.md'); s=p.read_text()
          if count:
              noun='false positive' if count==1 else 'false positives'
              banner=(f"> **Foundation and Inventory are validated. The raw V6 full-scan candidate union contains 79,782 potential starts; "
                      f"{count} evidence-proven {noun} ({excluded}) have been removed, so the current dashboard denominator is {den:,}. "
                      "V5's 79,016 fixed-point set is retained as the stricter high-confidence cross-check. Ordered decompilation is active in Phase 14 with one coordinator.**")
              s=re.sub(r'^> \*\*Foundation and Inventory are validated\..*\*\*$',banner,s,count=1,flags=re.M)
          p.write_text(s)
      - name: Validate
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Hygiene and binary rejection
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit publication and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-00407af0.yml
          git add CMakeLists.txt README.md database/claims.csv database/functions.csv database/history.csv decomp/evidence/fun_00407af0.md include/re5/recovered/fun_00407af0.hpp reports/functions.json reports/progress-treemap.svg reports/progress.md src/recovered/fun_00407af0.cpp tests/unit/test_fun_00407af0.cpp tests/unit/test_smoke.cpp
          git commit -m 'Publish FUN_00407AF0 fast-pass dashboard'
          git push
