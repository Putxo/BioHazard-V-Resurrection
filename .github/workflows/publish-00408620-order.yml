name: finalize-00408620-publication
on:
  push:
    branches: [release/main-fastpass154-00408620]
    paths: [.github/workflows/publish-00408620-order.yml]
permissions:
  contents: write
concurrency:
  group: finalize-00408620-publication
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve main records and restore only validated 8620
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main integration
          python3 - <<'PY'
          import csv, io, json, pathlib, subprocess
          BASE = '184a9d7ea3a858e1fdf364de8a2d1f6ddbc71737'
          VALIDATED = '3eadb787bb165b706cee86eef0809e48563f8109'
          TARGET = 'FUN_00408620'
          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8')
          def original(path):
              return git('show', f'{BASE}:{path}')
          def validated(path):
              return git('show', f'{VALIDATED}:{path}')
          def rows(text):
              return list(csv.DictReader(io.StringIO(text, newline='')))
          assert git('rev-parse', 'origin/main').strip() == BASE, 'main advanced: refuse stale publication'
          assert git('rev-parse', 'origin/integration').strip() == VALIDATED, 'integration advanced: repeat preflight'
          for path in ['src/recovered/fun_00408620.cpp', 'include/re5/recovered/fun_00408620.hpp', 'tests/unit/test_fun_00408620.cpp', 'decomp/evidence/fun_00408620.md']:
              assert git('rev-parse', f'HEAD:{path}') == git('rev-parse', f'{VALIDATED}:{path}'), path
          for path in ['database/functions.csv', 'database/claims.csv', 'database/history.csv']:
              before = original(path)
              assert TARGET not in before, (path, 'already published')
              additions = [line for line in validated(path).splitlines(keepends=True) if TARGET in line]
              assert len(additions) == (2 if path.endswith('history.csv') else 1), (path, len(additions))
              if path.endswith('history.csv'):
                  after = before + ''.join(additions)
              else:
                  lines = before.splitlines(keepends=True)
                  position = next(i for i, line in enumerate(lines) if 'FUN_00408630' in line)
                  after = ''.join(lines[:position] + additions + lines[position:])
              assert ''.join(line for line in after.splitlines(keepends=True) if TARGET not in line) == before, path
              pathlib.Path(path).write_text(after, encoding='utf-8', newline='')
          records = rows(pathlib.Path('database/functions.csv').read_text())
          assert all(None not in row and all(value is not None for value in row.values()) for row in records), 'CSV field alignment'
          assert [row for row in records if row['stable_id'] != TARGET] == rows(original('database/functions.csv')), 'parallel metadata changed'
          target = next(row for row in records if row['stable_id'] == TARGET)
          assert target == next(row for row in rows(validated('database/functions.csv')) if row['stable_id'] == TARGET)
          assert target['fast_pass'] == target['fast_pass_validated'] == 'true'
          assert target['pr'] == '#418' and target['commit'] == '4649170e7bee74ff04a8ee003a2381441e1315bb'
          assert len(records) == 155 and sum(int(row['size'], 0) for row in records if row['workflow_status'] != 'UNSEEN') == 24608
          assert sum(row['fast_pass'] == 'true' for row in records) == 154
          assert json.loads(pathlib.Path('config/inventory_freeze.json').read_text())['function_candidate_denominator'] == 79782
          print('PASS: exact validated 8620; all 154 existing records and historical rows preserved')
          PY
      - name: Regenerate canonical reports and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reports/report.py --publish-readme
          python3 tools/progress/treemap.py
          python3 tools/validate/validate.py
          python3 - <<'PY'
          import csv, json, pathlib, subprocess
          allowed = {'database/functions.csv', 'database/claims.csv', 'database/history.csv', 'README.md', 'reports/functions.json', 'reports/progress.md', 'reports/progress-treemap.svg'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed <= allowed, changed - allowed
          with open('database/functions.csv', newline='') as handle:
              records = list(csv.DictReader(handle))
          assert json.loads(pathlib.Path('reports/functions.json').read_text()) == records
          assert 'FUN_00408620 | FUN_00408620 | VA 0x00408620 | 6 bytes | FAST_PASS_VALIDATED' in pathlib.Path('reports/progress-treemap.svg').read_text()
          print('PASS: canonical JSON and treemap; no out-of-scope edits')
          PY
          git diff --check
      - name: Build and run all tests
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit only incremental publication metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- database/functions.csv database/claims.csv database/history.csv README.md reports/functions.json reports/progress.md reports/progress-treemap.svg
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve main ordering while publishing only validated FUN_00408620'
            git push origin HEAD:release/main-fastpass154-00408620
          fi
