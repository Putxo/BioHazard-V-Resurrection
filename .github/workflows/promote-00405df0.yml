name: promote-00405df0

on:
  push:
    branches: [promote/00405df0-fastpass-valid]

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[promote-00405df0]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/00405df0-fastpass-valid
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote only FUN_00405DF0 metadata
        shell: python
        run: |
          import csv
          import io
          from pathlib import Path

          functions = Path('database/functions.csv')
          text = functions.read_text(encoding='utf-8')
          rows = list(csv.DictReader(io.StringIO(text)))
          fieldnames = list(rows[0].keys())
          found = False
          for row in rows:
              if row['stable_id'] == 'FUN_00405DF0':
                  found = True
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#164'
                  row['commit'] = '151ee48c5f3ef44c0d32e0006373e7c0bee98be2'
                  suffix = '; PR #164 CI 5/5 PASS'
                  if suffix not in row['notes']:
                      row['notes'] += suffix
          if not found:
              raise SystemExit('FUN_00405DF0 missing from functions.csv')
          out = io.StringIO()
          writer = csv.DictWriter(out, fieldnames=fieldnames, lineterminator='\n')
          writer.writeheader()
          writer.writerows(rows)
          functions.write_text(out.getvalue().rstrip('\n'), encoding='utf-8')

          history = Path('database/history.csv')
          text = history.read_text(encoding='utf-8')
          row = 'FUN_00405DF0,2026-09-21,FAST_PASS,FAST_PASS_VALIDATED,151ee48c5f3ef44c0d32e0006373e7c0bee98be2,coordinator,PR #164 completed 5/5 CI checks\n'
          if 'FUN_00405DF0,2026-09-21,FAST_PASS,FAST_PASS_VALIDATED,' not in text:
              if text and not text.endswith('\n'):
                  text += '\n'
              history.write_text(text + row, encoding='utf-8')
      - name: Regenerate and validate canonical reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
      - name: Commit promotion and remove helper
        run: |
          rm .github/workflows/promote-00405df0.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add database/functions.csv database/history.csv reports/ .github/workflows/promote-00405df0.yml
          git commit -m 'Validate FUN_00405DF0 fast-pass block [promote-00405df0]'
          git push origin HEAD:promote/00405df0-fastpass-valid
