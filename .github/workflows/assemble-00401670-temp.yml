name: assemble-00401670-temp
on:
  push:
    branches: [decomp/00401670-sequential]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00401670-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fpath = Path('database/functions.csv')
          with fpath.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = reader.fieldnames
          if not any(r['stable_id'] == 'FUN_00401670' for r in rows):
              rows.append({
                  'stable_id':'FUN_00401670','va':'0x00401670','rva':'0x00001670','section':'.text','size':'75',
                  'provisional_name':'FUN_00401670','refined_name':'','workflow_status':'ACTIVE','confidence':'HIGH',
                  'fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false','verified':'false',
                  'matched':'false','linked':'false','calling_convention':'cdecl','return_type':'bool',
                  'arguments':'uint32_t achievement_index','this_type':'','module':'UNKNOWN','subsystem':'UNKNOWN',
                  'source_file':'src/recovered/fun_00401670.cpp','owner':'coordinator','claim_id':'SEQ-00401670',
                  'pr':'','commit':'','test':'tests/unit/test_fun_00401670.cpp',
                  'evidence':'decomp/evidence/fun_00401670.md',
                  'notes':'Steam achievement clear-and-store helper; exact 71-entry API-name table recovered'
              })
          with fpath.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          cpath = Path('database/claims.csv')
          ctext = cpath.read_text(encoding='utf-8')
          cline = 'SEQ-00401670,FUN_00401670,coordinator,decomp/00401670-sequential,sequential decomp of Steam achievement clear helper,2026-09-10T12:54:00Z,,,true\n'
          if cline not in ctext:
              cpath.write_text(ctext + cline, encoding='utf-8')

          hpath = Path('database/history.csv')
          htext = hpath.read_text(encoding='utf-8')
          hline = 'FUN_00401670,2026-09-10,UNSEEN,FAST_PASS,,coordinator,recovered exact Steam achievement clear/store flow with 71-entry API-name table\n'
          if hline not in htext:
              hpath.write_text(htext + hline, encoding='utf-8')
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          rm .github/workflows/assemble-00401670-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/claims.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg .github/workflows/assemble-00401670-temp.yml
          git commit -m 'Assemble FUN_00401670 fast pass metadata'
          git push origin HEAD:decomp/00401670-sequential
