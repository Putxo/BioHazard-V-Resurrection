name: prepare-batch-00408b50
on:
  push:
    branches: [decomp/00408b50-00408e00-exact]
    paths:
      - .github/workflows/prepare-batch-00408b50.yml
      - tools/maintenance/_batch_00408b50_payload_*.txt
permissions:
  contents: write
concurrency:
  group: prepare-batch-00408b50
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/00408b50-00408e00-exact
          fetch-depth: 0
      - name: Materialize hash-verified source-only bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,pathlib,zlib
          root=pathlib.Path('.')
          expected=['cd6d0042303b7f90b39542ea3218affe3062d70dc95839da89192366ebcd7294','6d8fba5364cffff49e3b51e87ec55fa7e31271cf8b7fa6bd2e3a8a3b30ee27af','aefb923aac39458a17e90ad02948da2d5a7917bcdc82b8675ca9ad8d1cb7cfc6','813f3808aa3b53044001ab8b32d30015f9e5b4c4b6d2e5bb8f9374ac243401c9']
          parts=[]
          for i,digest in enumerate(expected):
              text=(root/f'tools/maintenance/_batch_00408b50_payload_{i}.txt').read_text().strip()
              if i==1:
                  text=text.replace('DiPGGG+c3','DiPGG+c3').replace('Fvm5rhkC','Fvm5rjkC')
              assert hashlib.sha256(text.encode()).hexdigest()==digest, ('source fragment integrity',i)
              parts.append(text)
          payload=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert len(payload)==94842
          assert hashlib.sha256(payload).hexdigest()=='92ff6d4adb8ebe3f3f4e7a7665289c15d8bbba93f4d2b2d20b9e6231aaaf225d'
          files=json.loads(payload)
          allowed={'.github/workflows/verify-batch-00408b50.yml','cmake/recovery_batch_00408b50.cmake','decomp/evidence/batch_00408b50.json','decomp/evidence/batch_00408b50.md','decomp/evidence/batch_00408b50_instructions.md','include/re5/recovered/batch_00408b50.hpp','src/recovered/batch_00408b50.cpp','tests/unit/test_batch_00408b50.cpp','tools/maintenance/batch_00408b50.py','tools/verification/batch_00408b50_bridge.cpp','tools/verification/reproduce_v6_for_batch_00408b50.py','tools/verification/test_batch_00408b50_tools.py','tools/verification/verify_batch_00408b50.py'}
          assert set(files)==allowed
          for name,text in files.items():
              path=root/name
              assert not path.exists(), ('refuse overwrite',name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          for name in ['decomp/evidence/batch_00408b50.md','tools/verification/reproduce_v6_for_batch_00408b50.py']:
              p=root/name
              p.write_text(p.read_text().replace('Eight user-confirmed direct-root','Eight recorded direct-root').replace('The user-confirmed CSV anchors','The recorded CSV ordering anchors'))
          p=root/'tools/maintenance/batch_00408b50.py'
          p.write_text(p.read_text().replace("today='2026-09-25'; timestamp='2026-09-25T08:00:00Z'", "now=datetime.datetime.now(datetime.timezone.utc); today=now.date().isoformat(); timestamp=now.isoformat(timespec='seconds').replace('+00:00','Z')"))
          p=root/'decomp/evidence/batch_00408b50.json'
          manifest=json.loads(p.read_text())
          manifest['source_sha256']={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in manifest['source_sha256']}
          assert manifest['source_sha256']['tools/verification/reproduce_v6_for_batch_00408b50.py']=='6a693abddedf34f7cba9a911816ad845a73f201e98128d84d87bdc7b2270d93c'
          p.write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path('/tmp/batch-source-paths.txt').write_text('\n'.join(sorted(p for p in allowed if not p.startswith('.github/')))+'\n')
          print('Hash-verified source/evidence materialized; workflow publication uses the authorized connector separately')
          PY
      - name: Append only the 14 recovered IDs and regenerate reports
        run: python tools/maintenance/batch_00408b50.py recover
      - name: Full repository build and tests
        run: |
          cmake -S . -B /tmp/re5-batch-full -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/re5-batch-full --parallel 2
          ctest --test-dir /tmp/re5-batch-full --output-on-failure
          python tools/verification/test_batch_00408b50_tools.py
      - name: Independent GCC and Clang checks
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude src/recovered/batch_00408b50.cpp tests/unit/test_batch_00408b50.cpp -o /tmp/re5-batch-gcc
          /tmp/re5-batch-gcc
          clang++ -std=c++20 -O1 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude src/recovered/batch_00408b50.cpp tests/unit/test_batch_00408b50.cpp -o /tmp/re5-batch-clang
          /tmp/re5-batch-clang
          clang++ --target=i686-pc-windows-msvc -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude -c src/recovered/batch_00408b50.cpp -o /tmp/re5-batch-x86.obj
      - name: Publish ordinary source files only
        run: |
          set -euo pipefail
          git rm tools/maintenance/_batch_00408b50_payload_0.txt tools/maintenance/_batch_00408b50_payload_1.txt tools/maintenance/_batch_00408b50_payload_2.txt tools/maintenance/_batch_00408b50_payload_3.txt
          while IFS= read -r path; do git add -- "$path"; done < /tmp/batch-source-paths.txt
          git add CMakeLists.txt database/functions.csv database/claims.csv database/history.csv reports
          git diff --cached --check
          python tools/validate/validate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recover 14 exact-attachment routines 00408B50..00408E00 with differential evidence'
          git push origin HEAD:decomp/00408b50-00408e00-exact
      - name: Export a source snapshot and open analysis dependencies for local verification
        continue-on-error: true
        run: |
          mkdir -p /tmp/re5-local-analysis-kit
          git archive --format=tar HEAD > /tmp/re5-local-analysis-kit/repository.tar
          git rev-parse HEAD > /tmp/re5-local-analysis-kit/source-ref.txt
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps -d /tmp/re5-local-analysis-kit unicorn==2.1.4 capstone==5.0.6 pefile==2024.8.26
          cd /tmp/re5-local-analysis-kit
          sha256sum repository.tar *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: re5-local-analysis-kit
          path: /tmp/re5-local-analysis-kit/
          retention-days: 1
          if-no-files-found: error
