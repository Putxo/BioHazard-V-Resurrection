name: prepare-main-004066e0

on:
  push:
    branches:
      - release/main-fastpass99-004066e0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/main-fastpass99-004066e0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish only validated FUN_004066E0 onto current main
        run: |
          git fetch origin integration
          for path in \
            include/re5/recovered/fun_004066e0.hpp \
            src/recovered/fun_004066e0.cpp \
            tests/unit/test_fun_004066e0.cpp \
            decomp/evidence/fun_004066e0.md; do
            mkdir -p "$(dirname "$path")"
            git show origin/integration:"$path" > "$path"
          done
          python - <<'PY'
          from pathlib import Path
          import csv, io, subprocess

          def remote_csv(path):
              data = subprocess.check_output(['git','show',f'origin/integration:{path}'], text=True)
              return list(csv.DictReader(io.StringIO(data))), next(csv.reader(io.StringIO(data)))

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          if 'src/recovered/fun_004066e0.cpp' not in text:
              needle = '    src/recovered/fun_004066c0.cpp\n)'
              if needle not in text:
                  needle = ')\ntarget_include_directories(re5_recovered PUBLIC include)'
                  assert needle in text
                  text = text.replace(needle, '    src/recovered/fun_004066e0.cpp\n)\ntarget_include_directories(re5_recovered PUBLIC include)', 1)
              else:
                  text = text.replace(needle, '    src/recovered/fun_004066c0.cpp\n    src/recovered/fun_004066e0.cpp\n)', 1)
          if 'tests/unit/test_fun_004066e0.cpp' not in text:
              needle = '    tests/unit/test_fun_004066c0.cpp\n)'
              if needle not in text:
                  marker = ')\ntarget_link_libraries(re5_tests PRIVATE re5_recovered)'
                  assert marker in text
                  text = text.replace(marker, '    tests/unit/test_fun_004066e0.cpp\n)\ntarget_link_libraries(re5_tests PRIVATE re5_recovered)', 1)
              else:
                  text = text.replace(needle, '    tests/unit/test_fun_004066c0.cpp\n    tests/unit/test_fun_004066e0.cpp\n)', 1)
          cmake.write_text(text)

          smoke = Path('tests/unit/test_smoke.cpp')
          text = smoke.read_text()
          if 'void test_fun_004066e0();' not in text:
              needle = 'void test_fun_004066c0();\n'
              assert needle in text
              text = text.replace(needle, needle + 'void test_fun_004066e0();\n', 1)
          if '    test_fun_004066e0();\n' not in text:
              needle = '    test_fun_004066c0();\n'
              assert needle in text
              text = text.replace(needle, needle + '    test_fun_004066e0();\n', 1)
          smoke.write_text(text)

          for path, key in [('database/functions.csv','stable_id'), ('database/claims.csv','stable_id')]:
              local = Path(path)
              with local.open(newline='') as f:
                  reader = csv.DictReader(f); fields = reader.fieldnames; rows = list(reader)
              assert fields is not None
              remote_rows, _ = remote_csv(path)
              matches = [r for r in remote_rows if r.get(key) == 'FUN_004066E0']
              assert len(matches) == 1
              rows = [r for r in rows if r.get(key) != 'FUN_004066E0']
              rows.append(matches[0])
              with local.open('w', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader(); writer.writerows(rows)

          path = 'database/history.csv'
          local = Path(path)
          with local.open(newline='') as f:
              reader = csv.DictReader(f); fields = reader.fieldnames; rows = list(reader)
          assert fields is not None
          remote_rows, _ = remote_csv(path)
          matches = [r for r in remote_rows if r.get('stable_id') == 'FUN_004066E0']
          assert len(matches) == 2
          rows = [r for r in rows if r.get('stable_id') != 'FUN_004066E0'] + matches
          with local.open('w', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)

          evidence = Path('decomp/evidence/fun_004066e0.md')
          text = evidence.read_text().rstrip()
          if '## Public publication' not in text:
              text += '\n\n## Public publication\n\nThe cumulative public release was prepared on top of main `ff9393eda86bd56ba7d95b1edc1dca5288f534a8`, preserving already-published parallel state. Candidate PR #214 merged into integration as `454d328671f10c83db6468366bcd883f5e36dfc1`; promotion PR #215 merged as `3b0c94fbb6a77a872a67d2f596d255af1990f46f`. Only the validated `FUN_004066E0` delta is added by this publication.\n'
          evidence.write_text(text.rstrip() + '\n')
          PY
      - name: Regenerate public dashboard and validate
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev --output-on-failure
      - name: Commit publication
        run: |
          rm -f .github/workflows/temp-main-004066e0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish validated FUN_004066E0 dashboard'
          git push origin HEAD:release/main-fastpass99-004066e0
