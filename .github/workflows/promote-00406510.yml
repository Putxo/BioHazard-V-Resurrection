name: promote-00406510

on:
  push:
    branches:
      - promote/00406510-fastpass-valid

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/00406510-fastpass-valid
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote only FUN_00406510 metadata
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('database/functions.csv')
          with path.open(newline='') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          found = False
          for row in rows:
              if row['stable_id'] == 'FUN_00406510':
                  found = True
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#180'
                  row['commit'] = 'd9a8c5100d3850bd1445b96dea555f0e2aa0327c'
                  suffix = '; PR #180 CI 5/5 PASS'
                  if suffix not in row['notes']:
                      row['notes'] += suffix
          if not found:
              raise SystemExit('FUN_00406510 metadata row missing')
          with path.open('w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader()
              w.writerows(rows)

          history = Path('database/history.csv')
          with history.open(newline='') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())
          if not any(r['stable_id'] == 'FUN_00406510' and r['new_status'] == 'FAST_PASS_VALIDATED' for r in rows):
              rows.append({
                  'stable_id': 'FUN_00406510',
                  'date': '2026-09-21',
                  'old_status': 'FAST_PASS',
                  'new_status': 'FAST_PASS_VALIDATED',
                  'commit': 'd9a8c5100d3850bd1445b96dea555f0e2aa0327c',
                  'owner': 'coordinator',
                  'reason': 'PR #180 completed 5/5 CI checks'
              })
              with history.open('w', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writeheader()
                  w.writerows(rows)
          PY
      - name: Regenerate and validate canonical reports
        shell: bash
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
      - name: Build and test
        shell: bash
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Reject binary-like staged content
        shell: bash
        run: |
          if git status --porcelain | awk '{print $2}' | grep -Ei '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then
            echo 'Binary-like file detected' >&2
            exit 1
          fi
      - name: Commit promotion and remove helper
        shell: bash
        run: |
          rm .github/workflows/promote-00406510.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports .github/workflows/promote-00406510.yml
          git commit -m 'Validate FUN_00406510 fast-pass block [promote-00406510]'
          git push origin HEAD:promote/00406510-fastpass-valid
