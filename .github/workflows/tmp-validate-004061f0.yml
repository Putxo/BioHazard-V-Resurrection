name: tmp-validate-004061f0

on:
  push:
    branches: [decomp/004061f0-next]
    paths-ignore:
      - 'database/**'
      - 'reports/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add canonical metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          def append_once(path, needle, row):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if needle not in text:
                  with p.open('a', encoding='utf-8', newline='') as f:
                      if text and not text.endswith('\n'):
                          f.write('\n')
                      f.write(row + '\n')
          append_once('database/functions.csv','FUN_004061F0,','FUN_004061F0,0x004061F0,0x000061F0,.text,656,FUN_004061F0,,ACTIVE,HIGH,true,false,false,false,false,false,false,cdecl,void,std::int32_t message_index; const char* archive_resource; const FUN_004061F0_Entry* direct_entries; std::int32_t direct_count; const FUN_004061F0_Entry* resolved_entries; std::int32_t resolved_count,,UNKNOWN,Resource,src/recovered/fun_004061f0.cpp,coordinator,SEQ-004061F0,,,tests/unit/test_fun_004061f0.cpp,decomp/evidence/fun_004061f0.md,general archive resource registration helper with optional indexed path resolution two entry tables early archive-cancel cleanup and exact state restoration')
          append_once('database/claims.csv','SEQ-004061F0,FUN_004061F0,','SEQ-004061F0,FUN_004061F0,coordinator,decomp/004061f0-next,sequential decomp of generalized archive resource registration helper,2026-09-21T22:04:00Z,,,true')
          append_once('database/history.csv','FUN_004061F0,2026-09-21,UNSEEN,FAST_PASS,','FUN_004061F0,2026-09-21,UNSEEN,FAST_PASS,,coordinator,recovered generalized archive resource registration helper with conditional indexed resolution two tables early cleanup and state restoration')
          PY
      - name: Regenerate reports and validate
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          python -m pip install pytest
          python -m pytest -q tests/metadata
          git diff --check
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure Debug
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev
      - name: Commit metadata and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/claims.csv database/history.csv reports/progress.md reports/functions.json reports/progress-treemap.svg
          git diff --cached --quiet || git commit -m 'Record FUN_004061F0 fast-pass metadata'
          git push
