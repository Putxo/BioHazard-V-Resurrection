name: Reserve FUN_00408B30
on:
  push:
    branches: [decomp/00408b30-next]
    paths: [.github/workflows/preflight-00408b30.yml]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: reserve-00408b30
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full live preflight and isolated reservation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import csv, io, json, os, subprocess
          from datetime import datetime, timezone
          target = 'FUN_00408B30'
          branch = 'decomp/00408b30-next'
          repo = 'Putxo/BioHazard-V-Resurrection'
          expected_hash = '323d1aabccc74505745588097e2b298b14e114393bfc24f6830e98b658e67815'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def content(ref, path):
              return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}'], text=True))
          assert int('00408B30', 16) == 4229936
          assert int('00008B30', 16) == 35632
          assert 4229936 - 35632 == 0x00400000
          subprocess.run(['git', 'fetch', '--prune', 'origin'], check=True)
          assert git('rev-parse', 'HEAD') == git('rev-parse', f'origin/{branch}'), 'Reservation branch advanced'
          main = git('rev-parse', 'origin/main')
          integration = git('rev-parse', 'origin/integration')
          refs = [line.split(' ', 1) for line in git('for-each-ref', '--format=%(objectname) %(refname:strip=3)', 'refs/remotes/origin').splitlines()]
          target_refs = [name for sha,name in refs if '00408b30' in name.lower()]
          assert target_refs == [branch], f'Conflicting target branches: {target_refs}'
          snapshots = {}
          for ref in [main, integration]:
              frozen = json.loads(content(ref, 'config/inventory_freeze.json'))
              assert frozen['function_candidate_denominator'] == 79782
              assert frozen['target_sha256'] == expected_hash and frozen['target_size'] == 19977216
              snapshots[ref] = {}
              for path in ['database/functions.csv', 'database/claims.csv']:
                  records = list(csv.DictReader(io.StringIO(content(ref, path))))
                  assert not any(r.get('stable_id', '').upper() == target for r in records), (ref, path, 'existing target')
                  if path.endswith('functions.csv'):
                      assert not any(int(r['va'], 0) == 4229936 for r in records if r.get('va')), (ref, 'existing VA')
                  snapshots[ref][path] = {'blob':git('rev-parse', f'{ref}:{path}'), 'records':len(records)}
          pulls = []
          page = 1
          while True:
              batch = api(f'pulls?state=open&per_page=100&page={page}')
              pulls.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          for pr in pulls:
              text = '\n'.join([pr['title'], pr.get('body') or '', pr['head']['ref']]).lower()
              assert '00408b30' not in text and '4229936' not in text, f'Conflicting PR #{pr["number"]}'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'merge', '--no-edit', integration], check=True)
          stamp = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          path = Path('database/claims.csv')
          baseline = content(integration, str(path))
          assert path.read_text() == baseline
          assert len(next(csv.reader(io.StringIO(baseline)))) == 9
          row = ['SEQ-00408B30', target, 'coordinator', branch,
                 'exclusive reservation; exact local EXE analysis pending; no recovery or validation tier claimed',
                 stamp, '', '', 'true']
          out = io.StringIO()
          csv.writer(out, lineterminator='\n').writerow(row)
          path.write_text(baseline.rstrip('\n') + '\n' + out.getvalue())
          subprocess.run(['python3', 'tools/validate/validate.py'], check=True)
          # No source, unit-test, inventory, history, report or dashboard edits.
          assert content(integration, 'database/functions.csv') == Path('database/functions.csv').read_text()
          assert path.read_text().splitlines()[:-1] == baseline.splitlines()
          parallel = {name:sha for sha,name in refs if any(token in name.lower() for token in ['00408700','00408af0','00408b10'])}
          note = [
              '# FUN_00408B30 exclusive reservation and preflight', '',
              f'Preflight timestamp: `{stamp}`.',
              f'Branch: `{branch}`; claim: `SEQ-00408B30`.', '',
              '## Verified remote preflight', '',
              f'- main: `{main}`.',
              f'- integration: `{integration}`.',
              '- Complete functions.csv and claims.csv parsed on both exact commits: no target stable ID or existing target VA.',
              '- All fetched remote branch names checked case-insensitively: only the newly reserved target branch exists.',
              f'- All open PR pages checked; observed PRs: {", ".join("#" + str(p["number"]) for p in pulls) or "none"}; no target collision.',
              '- Repository metadata validator passed after appending only the exclusive claim.',
              '- This PASS concerns preflight/reservation metadata only, NOT function implementation or CI 5/5.', '',
              'Registry snapshots:', '', '```json', json.dumps(snapshots, indent=2), '```', '',
              'Parallel refs observed, never modified by this workflow:', '', '```json', json.dumps(parallel, indent=2), '```', '',
              '## Assignment and evidence limits', '',
              '- User-supplied candidate: row 144; RVA 35632 (0x00008B30); VA 4229936 (0x00408B30).',
              '- Decimal/hex arithmetic and image-base relation verified. The local canonical function_candidates.csv is not mounted in this resumption environment; no independent CSV-row read is claimed.',
              '- Expected private input: 9) RE5DX9_1.1.0 Dev (Release 15 des. 2017).exe; size 19,977,216 bytes.',
              f'- Expected input SHA-256: `{expected_hash}`. This is an expected hash, not a freshly verified local EXE hash.',
              '- The local analysis environment has no mounted EXE. Two Biblioteca/personal-context searches returned historical references but no binary bytes or usable current download reference.',
              '- No executable is obtained from GitHub or uploaded to GitHub. This workflow reads repository text and metadata only.', '',
              '## Current target status', '',
              '**RESERVED; exact analysis blocked by missing private EXE bytes.**', '',
              'No instruction bytes, native length, calling convention, dependencies, semantics, C++ implementation, unit-test result, FAST_PASS or FAST_PASS_VALIDATED result is asserted for this target.',
              'No function row is added to functions.csv, so all recovery metrics and the canonical denominator of 79,782 remain unchanged.',
              'No implementation PR, promotion or main publication has been performed. Do not merge this reservation as a completed recovery.', '',
              '## Exact continuation point', '',
              'Continue this branch and existing claim, not another function. Materialize the private EXE locally, verify its complete size/SHA-256, and verify the assigned row in the local canonical candidate CSV. Then analyze only 0x00408B30 and its necessary dependencies, reconstruct from actual instructions, add guard/early-exit tests and evidence, and complete the three independently checked CI/merge stages.',
              'Preserve FUN_00408700, FUN_00408AF0, FUN_00408B10 and all concurrent work. Never upload EXE/DLL/assets/.obj or binary products.', '',
              f'Preflight execution: https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}', ''
          ]
          note_path = Path('decomp/evidence/fun_00408b30-preflight.md')
          note_path.write_text('\n'.join(note))
          Path('.github/workflows/preflight-00408b30.yml').unlink()
          subprocess.run(['git', 'add', '-u'], check=True)
          subprocess.run(['git', 'add', str(note_path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          changed = set(git('diff', '--cached', '--name-only', integration).splitlines())
          assert changed == {'database/claims.csv', str(note_path)}, changed
          assert not any(p.lower().endswith(('.exe','.dll','.obj','.pdb','.bin','.pak','.arc')) for p in git('ls-files').splitlines())
          subprocess.run(['git', 'fetch', 'origin', 'main', 'integration', branch], check=True)
          assert git('rev-parse', 'origin/main') == main, 'main advanced; repeat preflight'
          assert git('rev-parse', 'origin/integration') == integration, 'integration advanced; repeat preflight'
          subprocess.run(['git', 'commit', '-m', 'Reserve only FUN_00408B30; record verified preflight and missing private EXE'], check=True)
          subprocess.run(['git', 'push', 'origin', f'HEAD:refs/heads/{branch}'], check=True)
          print('PRELIGHT/RESERVATION PASS; function analysis remains BLOCKED_MISSING_PRIVATE_EXE')
