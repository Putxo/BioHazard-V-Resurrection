name: materialize-canonical-200
on:
  push:
    branches: [decomp/canonical-200, promote/canonical-200, release/canonical-200]
    paths: [.canonical-200-plan.json, .github/workflows/materialize-canonical-200.yml]
permissions:
  contents: write
jobs:
  prepare-exclusive-branch:
    if: github.repository == 'Putxo/BioHazard-V-Resurrection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-200-transport
          path: |
            .canonical-200-source.part*
            .canonical-200-plan.json
          include-hidden-files: true
          retention-days: 1
      - name: Materialize only checksum-pinned source and scoped registry outputs
        shell: python
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          import base64,hashlib,json,os,pathlib,subprocess,sys,zlib
          def run(*args,**kwargs):
              return subprocess.run(args,check=True,**kwargs)
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          p=json.loads(pathlib.Path('.canonical-200-plan.json').read_text())
          branch=os.environ['EXPECTED_BRANCH']
          expected=os.environ['EXPECTED_SHA']
          stages={'decomp/canonical-200':'register','promote/canonical-200':'promote','release/canonical-200':'publish'}
          assert branch in stages and p['branch']==branch and p['stage']==stages[branch]
          assert git('rev-parse','HEAD')==expected
          if p.get('source_patch_sha256'):
              encoded=''.join(path.read_text().strip() for path in sorted(pathlib.Path('.').glob('.canonical-200-source.part*')))
              for start,old,new in sorted(p.get('transport_repairs',[]),reverse=True):
                  assert encoded[start:start+len(old)]==old,(start,old)
                  encoded=encoded[:start]+new+encoded[start+len(old):]
              patch=zlib.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(patch).hexdigest()==p['source_patch_sha256'],'Source patch digest mismatch'
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-200-source.patch'
              path.write_bytes(patch)
              run('git','apply','--check','--exclude=.github/workflows/*',str(path))
              run('git','apply','--exclude=.github/workflows/*',str(path))
          command=[sys.executable,'tools/maintenance/canonical_200.py',p['stage']]
          if p['stage']=='promote':
              for key in ['recovery_pr','recovery_head','recovery_merge']:
                  command+=['--'+key.replace('_','-'),str(p[key])]
          if p['stage']=='publish':command+=['--source-ref',p['source_ref']]
          run(*command)
          expected_files=p['files_sha256']
          for name,digest in expected_files.items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.suffix.lower() not in {'.exe','.dll','.obj','.o','.bin','.arc','.pak','.pdb'}
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,'Output digest mismatch: '+name
          changed=set(git('diff','--name-only').splitlines())
          assert changed<=set(expected_files),(changed-set(expected_files))
          run('git','add','--',*expected_files)
          assert set(git('diff','--cached','--name-only').splitlines())<=set(expected_files)
          run('git','diff','--cached','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','Materialize checksum-verified canonical 200 '+p['stage'])
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==expected,'Remote advanced; refusing to overwrite'
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('PREPARED_COMMIT='+git('rev-parse','HEAD'))
          with open(pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-200-result.tar','wb') as out:
              run('git','archive','--format=tar','HEAD',stdout=out)
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-200-result
          path: ${{ runner.temp }}/canonical-200-result.tar
          retention-days: 1
          if-no-files-found: error
