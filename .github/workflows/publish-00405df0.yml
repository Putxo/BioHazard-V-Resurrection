name: publish-00405df0

on:
  push:
    branches: [release/main-fastpass84-00405df0]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish-00405df0]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/main-fastpass84-00405df0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the validated integration delta after fast-pass 83
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin integration
          git cat-file -e 8e36940cc721ad00037861e49031b8cbc933c6b1^{commit}
          git cat-file -e 5e0c688c19efade213ee0cefd7ad5cd41cba2ac6^{commit}
          git diff --binary 8e36940cc721ad00037861e49031b8cbc933c6b1 5e0c688c19efade213ee0cefd7ad5cd41cba2ac6 -- . ':!README.md' > /tmp/00405df0-release.patch
          if grep -E '^diff --git a/.*\.(exe|dll|obj|lib|pdb|pak|arc|bin)( |$)' /tmp/00405df0-release.patch; then
            echo 'Forbidden binary-like file in release delta' >&2
            exit 1
          fi
          git apply --index --3way /tmp/00405df0-release.patch
      - name: Publish README and regenerate canonical progress
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
      - name: Configure build and tests
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit publication and remove helper
        run: |
          rm .github/workflows/publish-00405df0.yml
          git add -A
          if git diff --cached --name-only | grep -E '\.(exe|dll|obj|lib|pdb|pak|arc|bin)$'; then
            echo 'Forbidden binary-like file staged' >&2
            exit 1
          fi
          git commit -m 'Publish FUN_00405DF0 fast-pass dashboard [publish-00405df0]'
          git push origin HEAD:release/main-fastpass84-00405df0
