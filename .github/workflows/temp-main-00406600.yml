name: prepare-main-00406600

on:
  push:
    branches: [release/main-00406600]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/main-00406600
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish only validated FUN_00406600 onto current main
        shell: bash
        run: |
          git fetch origin integration
          validated=e621a22d8b0a03c3a07335092353c68d71446ba5
          promotion=2074492674c28800ebc23b918d29caee2fdd236f
          for f in include/re5/recovered/fun_00406600.hpp src/recovered/fun_00406600.cpp tests/unit/test_fun_00406600.cpp decomp/evidence/fun_00406600.md; do
            mkdir -p "$(dirname "$f")"
            git show "$promotion":"$f" > "$f"
          done
          python - <<'PY'
          from pathlib import Path
          import subprocess

          promotion='2074492674c28800ebc23b918d29caee2fdd236f'
          def show(path):
              return subprocess.check_output(['git','show',f'{promotion}:{path}'], text=True)

          cmake=Path('CMakeLists.txt'); t=cmake.read_text()
          if 'src/recovered/fun_00406600.cpp' not in t:
              for a in ['    src/recovered/fun_004065d0.cpp\n','    src/recovered/fun_004065a0.cpp\n']:
                  if a in t: t=t.replace(a,a+'    src/recovered/fun_00406600.cpp\n',1); break
              else: raise SystemExit('source anchor missing')
          if 'tests/unit/test_fun_00406600.cpp' not in t:
              for a in ['    tests/unit/test_fun_004065d0.cpp\n','    tests/unit/test_fun_004065a0.cpp\n']:
                  if a in t: t=t.replace(a,a+'    tests/unit/test_fun_00406600.cpp\n',1); break
              else: raise SystemExit('test anchor missing')
          cmake.write_text(t)

          smoke=Path('tests/unit/test_smoke.cpp'); t=smoke.read_text()
          if 'void test_fun_00406600();' not in t:
              for a in ['void test_fun_004065d0();\n','void test_fun_004065a0();\n']:
                  if a in t: t=t.replace(a,a+'void test_fun_00406600();\n',1); break
              else: raise SystemExit('smoke decl anchor missing')
          if '    test_fun_00406600();' not in t:
              for a in ['    test_fun_004065d0();\n','    test_fun_004065a0();\n']:
                  if a in t: t=t.replace(a,a+'    test_fun_00406600();\n',1); break
              else: raise SystemExit('smoke call anchor missing')
          smoke.write_text(t)

          src_lines=show('database/functions.csv').splitlines()
          target=next((x for x in src_lines if x.startswith('FUN_00406600,')),None)
          if not target: raise SystemExit('validated function row missing')
          p=Path('database/functions.csv'); lines=p.read_text().splitlines()
          lines=[target if x.startswith('FUN_00406600,') else x for x in lines]
          if not any(x.startswith('FUN_00406600,') for x in lines): lines.append(target)
          p.write_text('\n'.join(lines)+'\n')

          src_lines=show('database/claims.csv').splitlines()
          target=next((x for x in src_lines if x.startswith('SEQ-00406600,FUN_00406600,')),None)
          if not target: raise SystemExit('claim row missing')
          p=Path('database/claims.csv'); lines=p.read_text().splitlines()
          lines=[target if x.startswith('SEQ-00406600,FUN_00406600,') else x for x in lines]
          if not any(x.startswith('SEQ-00406600,FUN_00406600,') for x in lines): lines.append(target)
          p.write_text('\n'.join(lines)+'\n')

          source_history=[x for x in show('database/history.csv').splitlines() if x.startswith('FUN_00406600,')]
          p=Path('database/history.csv'); lines=p.read_text().splitlines(); existing=set(lines)
          for x in source_history:
              if x not in existing: lines.append(x); existing.add(x)
          p.write_text('\n'.join(lines)+'\n')

          p=Path('decomp/evidence/fun_00406600.md'); t=p.read_text()
          note='\n## Public publication\n\nThe public release was prepared on top of main `ea1553f8d305d0b8742a7ee47058154477109578`, preserving the already-published parallel state and publishing only the validated `FUN_00406600` delta. Promotion PR #201 merged into integration as `2074492674c28800ebc23b918d29caee2fdd236f`.\n'
          if '## Public publication' not in t: p.write_text(t.rstrip()+note)
          PY
      - name: Regenerate public dashboard and validate
        shell: bash
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit publication
        shell: bash
        run: |
          rm .github/workflows/temp-main-00406600.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish validated FUN_00406600 dashboard'
          git push origin HEAD:release/main-00406600
