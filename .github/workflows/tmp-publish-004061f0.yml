name: tmp-publish-004061f0

on:
  push:
    branches: [release/main-004061f0]
    paths:
      - '.github/workflows/tmp-publish-004061f0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch validated FUN_004061F0 source snapshot
        run: |
          git fetch --depth=1 origin 8074103e861bfc9bb325edb9f4c7ee1ece4b4f98
          mkdir -p include/re5/recovered src/recovered tests/unit decomp/evidence
          git show FETCH_HEAD:include/re5/recovered/fun_004061f0.hpp > include/re5/recovered/fun_004061f0.hpp
          git show FETCH_HEAD:src/recovered/fun_004061f0.cpp > src/recovered/fun_004061f0.cpp
          git show FETCH_HEAD:tests/unit/test_fun_004061f0.cpp > tests/unit/test_fun_004061f0.cpp
          git show FETCH_HEAD:decomp/evidence/fun_004061f0.md > decomp/evidence/fun_004061f0.md
          git show FETCH_HEAD:database/functions.csv > /tmp/functions.integration.csv
          git show FETCH_HEAD:database/claims.csv > /tmp/claims.integration.csv
          git show FETCH_HEAD:database/history.csv > /tmp/history.integration.csv
      - name: Add only FUN_004061F0 metadata and wiring
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          TARGET = 'FUN_004061F0'

          def read_csv(path):
              with open(path, newline='', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  return reader.fieldnames, list(reader)

          def write_csv(path, fields, rows):
              with open(path, 'w', newline='', encoding='utf-8') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  writer.writeheader()
                  writer.writerows(rows)

          # functions.csv: exact validated target row from integration.
          dst_fields, dst_rows = read_csv('database/functions.csv')
          src_fields, src_rows = read_csv('/tmp/functions.integration.csv')
          target_rows = [r for r in src_rows if r.get('stable_id') == TARGET]
          if len(target_rows) != 1:
              raise SystemExit(f'expected one {TARGET} functions row, got {len(target_rows)}')
          dst_rows = [r for r in dst_rows if r.get('stable_id') != TARGET]
          dst_rows.extend(target_rows)
          write_csv('database/functions.csv', dst_fields, dst_rows)

          # claims.csv: exact target claim row(s), without touching any other claim.
          dst_fields, dst_rows = read_csv('database/claims.csv')
          src_fields, src_rows = read_csv('/tmp/claims.integration.csv')
          target_rows = [r for r in src_rows if r.get('stable_id') == TARGET]
          if not target_rows:
              raise SystemExit(f'no {TARGET} claim row found')
          dst_rows = [r for r in dst_rows if r.get('stable_id') != TARGET]
          dst_rows.extend(target_rows)
          write_csv('database/claims.csv', dst_fields, dst_rows)

          # history.csv: copy all target transitions, preserving every other row.
          dst_fields, dst_rows = read_csv('database/history.csv')
          src_fields, src_rows = read_csv('/tmp/history.integration.csv')
          target_rows = [r for r in src_rows if r.get('stable_id') == TARGET]
          if len(target_rows) < 2:
              raise SystemExit(f'expected target FAST_PASS and validation history, got {len(target_rows)} rows')
          dst_rows = [r for r in dst_rows if r.get('stable_id') != TARGET]
          dst_rows.extend(target_rows)
          write_csv('database/history.csv', dst_fields, dst_rows)

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          source_line = '    src/recovered/fun_004061f0.cpp\n'
          if source_line not in text:
              anchor = '    src/recovered/fun_00406010.cpp\n'
              if anchor not in text:
                  raise SystemExit('CMake source anchor missing')
              text = text.replace(anchor, anchor + source_line, 1)
          test_line = '    tests/unit/test_fun_004061f0.cpp\n'
          if test_line not in text:
              anchor = '    tests/unit/test_fun_00406010.cpp\n'
              if anchor not in text:
                  raise SystemExit('CMake test anchor missing')
              text = text.replace(anchor, anchor + test_line, 1)
          cmake.write_text(text, encoding='utf-8')

          smoke = Path('tests/unit/test_smoke.cpp')
          text = smoke.read_text(encoding='utf-8')
          decl = 'void test_fun_004061f0();\n'
          if decl not in text:
              anchor = 'void test_fun_00406010();\n'
              if anchor not in text:
                  raise SystemExit('smoke declaration anchor missing')
              text = text.replace(anchor, anchor + decl, 1)
          call = '    test_fun_004061f0();\n'
          if call not in text:
              anchor = '    test_fun_00406010();\n'
              if anchor not in text:
                  raise SystemExit('smoke call anchor missing')
              text = text.replace(anchor, anchor + call, 1)
          smoke.write_text(text, encoding='utf-8')
          PY
      - name: Publish README and regenerate canonical reports
        run: |
          python tools/reports/report.py --publish-readme
          python tools/progress/treemap.py
          python tools/validate/validate.py
          python -m pip install pytest
          python -m pytest -q tests/metadata
          git diff --check
      - name: Reject binary-like release content
        run: |
          if git diff --name-only HEAD | grep -Ei '\.(exe|dll|obj)$'; then
            echo 'Forbidden binary-like file in release diff'
            exit 1
          fi
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure, build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit public release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CMakeLists.txt database/functions.csv database/claims.csv database/history.csv decomp/evidence/fun_004061f0.md include/re5/recovered/fun_004061f0.hpp src/recovered/fun_004061f0.cpp tests/unit/test_fun_004061f0.cpp tests/unit/test_smoke.cpp reports/progress.md reports/functions.json reports/progress-treemap.svg
          git diff --cached --quiet || git commit -m 'Publish FUN_004061F0 validated fast-pass'
          git push
