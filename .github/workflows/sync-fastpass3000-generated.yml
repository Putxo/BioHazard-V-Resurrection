name: sync-fastpass3000-generated
on:
  push:
    branches: [fix/004010f0-fast-pass-3000]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/004010f0-fast-pass-3000
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync generated FAST PASS 3000 reports"
          git push origin HEAD:fix/004010f0-fast-pass-3000
