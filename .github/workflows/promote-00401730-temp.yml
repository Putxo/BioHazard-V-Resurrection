name: promote-00401730-temp
on:
  push:
    branches:
      - decomp/promote-00401730-ci
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/promote-00401730-ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote metadata and regenerate reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fpath = Path('database/functions.csv')
          with fpath.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = rows[0].keys()
          for row in rows:
              if row['stable_id'] == 'FUN_00401730':
                  row['fast_pass_validated'] = 'true'
                  row['pr'] = '#72'
                  row['commit'] = '08374a9b5816a2c68257cca6e11ff94048900ab5'
                  row['notes'] = '8-byte feedback XOR encoder; exact four-argument contract and processed-byte return recovered; PR #72 CI 5/5 PASS'
                  break
          else:
              raise SystemExit('FUN_00401730 row not found')
          with fpath.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          hpath = Path('database/history.csv')
          with hpath.open('a', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerow(['FUN_00401730','2026-09-10','FAST_PASS','FAST_PASS_VALIDATED','08374a9b5816a2c68257cca6e11ff94048900ab5','coordinator','PR #72 completed 5/5 CI checks'])
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
          git rm .github/workflows/promote-00401730-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg
          git commit -m 'Promote FUN_00401730 after PR #72 CI'
          git push origin HEAD:decomp/promote-00401730-ci
