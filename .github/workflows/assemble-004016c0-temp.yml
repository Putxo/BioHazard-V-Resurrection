name: assemble-004016c0-temp
on:
  push:
    branches: [decomp/004016c0-sequential]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: decomp/004016c0-sequential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Assemble metadata and reports
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fpath = Path('database/functions.csv')
          with fpath.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = reader.fieldnames
          if not any(r['stable_id'] == 'FUN_004016C0' for r in rows):
              rows.append({
                  'stable_id':'FUN_004016C0','va':'0x004016C0','rva':'0x000016C0','section':'.text','size':'108',
                  'provisional_name':'FUN_004016C0','refined_name':'','workflow_status':'ACTIVE','confidence':'HIGH',
                  'fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false','verified':'false',
                  'matched':'false','linked':'false','calling_convention':'cdecl','return_type':'bool',
                  'arguments':'uint32_t achievement_index','this_type':'','module':'UNKNOWN','subsystem':'UNKNOWN',
                  'source_file':'src/recovered/fun_004016c0.cpp','owner':'coordinator','claim_id':'SEQ-004016C0',
                  'pr':'','commit':'','test':'tests/unit/test_fun_004016c0.cpp',
                  'evidence':'decomp/evidence/fun_004016c0.md',
                  'notes':'Steam achievement set-and-store helper with index<71 guard and exact shared API-name table'
              })
          with fpath.open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader(); w.writerows(rows)

          cpath = Path('database/claims.csv')
          ctext = cpath.read_text(encoding='utf-8')
          cline = 'SEQ-004016C0,FUN_004016C0,coordinator,decomp/004016c0-sequential,sequential decomp of Steam achievement set helper,2026-09-10T13:03:00Z,,,true\n'
          if cline not in ctext:
              cpath.write_text(ctext + cline, encoding='utf-8')

          hpath = Path('database/history.csv')
          htext = hpath.read_text(encoding='utf-8')
          hline = 'FUN_004016C0,2026-09-10,UNSEEN,FAST_PASS,,coordinator,recovered exact Steam achievement set/store flow with index bound and shared API-name table\n'
          if hline not in htext:
              hpath.write_text(htext + hline, encoding='utf-8')
          PY
          python tools/reports/report.py
          python tools/progress/treemap.py
          rm .github/workflows/assemble-004016c0-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/claims.csv database/history.csv reports/functions.json reports/progress.md reports/progress-treemap.svg .github/workflows/assemble-004016c0-temp.yml
          git commit -m 'Assemble FUN_004016C0 fast pass metadata'
          git push origin HEAD:decomp/004016c0-sequential
