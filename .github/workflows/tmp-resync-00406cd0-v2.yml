name: tmp-resync-00406cd0-v2

on:
  push:
    branches: [decomp/00406cd0-next]
    paths:
      - '.github/workflows/tmp-resync-00406cd0-v2.yml'

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore target-only files
        run: |
          git fetch --depth=1 origin 4226da898174be1726000c99a19d5b52bb59b24e
          mkdir -p include/re5/recovered src/recovered tests/unit decomp/evidence
          git show FETCH_HEAD:include/re5/recovered/fun_00406cd0.hpp > include/re5/recovered/fun_00406cd0.hpp
          git show FETCH_HEAD:src/recovered/fun_00406cd0.cpp > src/recovered/fun_00406cd0.cpp
          git show FETCH_HEAD:tests/unit/test_fun_00406cd0.cpp > tests/unit/test_fun_00406cd0.cpp
          git show FETCH_HEAD:decomp/evidence/fun_00406cd0.md > decomp/evidence/fun_00406cd0.md
      - name: Apply target-only wiring and metadata
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          target='FUN_00406CD0'

          cmake=Path('CMakeLists.txt'); text=cmake.read_text(encoding='utf-8')
          for line,anchors in [
              ('    src/recovered/fun_00406cd0.cpp\n',['    src/recovered/fun_00406ca0.cpp\n','    src/recovered/fun_00406b20.cpp\n']),
              ('    tests/unit/test_fun_00406cd0.cpp\n',['    tests/unit/test_fun_00406ca0.cpp\n','    tests/unit/test_fun_00406b20.cpp\n'])]:
              if line not in text:
                  anchor=next((a for a in anchors if a in text),None)
                  if anchor is None: raise SystemExit('CMake anchor missing')
                  text=text.replace(anchor,anchor+line,1)
          cmake.write_text(text,encoding='utf-8')

          smoke=Path('tests/unit/test_smoke.cpp'); text=smoke.read_text(encoding='utf-8')
          for line,anchors in [
              ('void test_fun_00406cd0();\n',['void test_fun_00406ca0();\n','void test_fun_00406b20();\n']),
              ('    test_fun_00406cd0();\n',['    test_fun_00406ca0();\n','    test_fun_00406b20();\n'])]:
              if line not in text:
                  anchor=next((a for a in anchors if a in text),None)
                  if anchor is None: raise SystemExit('smoke anchor missing')
                  text=text.replace(anchor,anchor+line,1)
          smoke.write_text(text,encoding='utf-8')

          p=Path('database/functions.csv')
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          rows=[r for r in rows if r['stable_id']!=target]
          rows.append({
              'stable_id':target,'va':'0x00406CD0','rva':'0x00006CD0','section':'.text','size':'209',
              'provisional_name':target,'refined_name':'','workflow_status':'ACTIVE','confidence':'HIGH',
              'fast_pass':'true','fast_pass_validated':'false','converted':'false','refined':'false',
              'verified':'false','matched':'false','linked':'false','calling_convention':'cdecl',
              'return_type':'void','arguments':'void','this_type':'void','module':'UNKNOWN',
              'subsystem':'Resource','source_file':'src/recovered/fun_00406cd0.cpp','owner':'coordinator',
              'claim_id':'SEQ-00406CD0','pr':'','commit':'','test':'tests/unit/test_fun_00406cd0.cpp',
              'evidence':'decomp/evidence/fun_00406cd0.md',
              'notes':'batch resource registration routine with diagnostic marker and eight exact FUN_004061F0 dispatch groups; four direct callers; native body has no conditional branch'
          })
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p=Path('database/claims.csv')
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          rows=[r for r in rows if r['stable_id']!=target]
          rows.append({
              'claim_id':'SEQ-00406CD0','stable_id':target,'owner':'coordinator',
              'branch':'decomp/00406cd0-next','task':'sequential decomp of eight-group resource registration batch',
              'claimed_at':'2026-09-23T18:23:00Z','expires_at':'','pr':'','active':'true'
          })
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          p=Path('database/history.csv')
          with p.open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f)); fields=list(rows[0].keys())
          rows=[r for r in rows if r['stable_id']!=target]
          rows.append({
              'stable_id':target,'date':'2026-09-23','old_status':'UNSEEN','new_status':'FAST_PASS',
              'commit':'','owner':'coordinator',
              'reason':'recovered marker-led eight-group resource registration batch from exact executable'
          })
          with p.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          PY
      - name: Regenerate validate build test
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          python -m pip install pytest
          python -m pytest -q tests/metadata
          git diff --check
          if git status --porcelain | grep -Ei '\.(exe|dll|obj)( |$)'; then exit 1; fi
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit resynced candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt tests/unit/test_smoke.cpp database/functions.csv database/claims.csv database/history.csv reports/progress.md reports/functions.json reports/progress-treemap.svg include/re5/recovered/fun_00406cd0.hpp src/recovered/fun_00406cd0.cpp tests/unit/test_fun_00406cd0.cpp decomp/evidence/fun_00406cd0.md
          git diff --cached --quiet || git commit -m 'Decompile FUN_00406CD0 on latest integration'
          git push
