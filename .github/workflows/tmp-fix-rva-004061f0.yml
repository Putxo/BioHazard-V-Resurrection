name: tmp-fix-rva-004061f0

on:
  push:
    branches: [decomp/004061f0-next]
    paths:
      - '.github/workflows/tmp-fix-rva-004061f0.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct canonical RVA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('database/functions.csv')
          text = p.read_text(encoding='utf-8')
          old = 'FUN_004061F0,0x004061F0,0x000051F0,'
          new = 'FUN_004061F0,0x004061F0,0x000061F0,'
          if old not in text:
              raise SystemExit('target functions.csv RVA pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('decomp/evidence/fun_004061f0.md')
          text = p.read_text(encoding='utf-8')
          old = '- RVA: `0x000051F0`'
          new = '- RVA: `0x000061F0`'
          if old not in text:
              raise SystemExit('target evidence RVA pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate and validate
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          python -m pip install pytest
          python -m pytest -q tests/metadata
          git diff --check
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Commit corrected metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv decomp/evidence/fun_004061f0.md reports/progress.md reports/functions.json reports/progress-treemap.svg
          git commit -m 'Correct FUN_004061F0 RVA metadata'
          git push
