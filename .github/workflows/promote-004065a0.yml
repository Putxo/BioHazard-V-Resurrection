name: promote-004065a0

on:
  push:
    branches:
      - promote/004065a0-fastpass-valid

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote only FUN_004065A0 metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import csv, datetime as dt

          p=Path('database/functions.csv')
          with p.open(newline='') as f:
              r=csv.DictReader(f); fields=r.fieldnames; rows=list(r)
          if fields is None: raise SystemExit('missing functions header')
          matches=[x for x in rows if x['stable_id']=='FUN_004065A0']
          if len(matches)!=1: raise SystemExit(f'expected one target row, got {len(matches)}')
          row=matches[0]
          if row['fast_pass']!='true': raise SystemExit('target is not FAST_PASS')
          row['fast_pass_validated']='true'
          row['pr']='#194'
          row['commit']='6d8f0b34fedac6e2400375631e22356d10da8aad'
          note='PR #194 CI 5/5 PASS'
          if note not in row['notes']:
              row['notes']=(row['notes'].rstrip('; ')+'; '+note) if row['notes'] else note
          with p.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          h=Path('database/history.csv')
          with h.open(newline='') as f:
              r=csv.DictReader(f); hfields=r.fieldnames; hrows=list(r)
          if hfields is None: raise SystemExit('missing history header')
          if not any(x['stable_id']=='FUN_004065A0' and x['new_status']=='FAST_PASS_VALIDATED' for x in hrows):
              hrows.append({
                  'stable_id':'FUN_004065A0',
                  'date':dt.datetime.now(dt.timezone.utc).date().isoformat(),
                  'old_status':'FAST_PASS',
                  'new_status':'FAST_PASS_VALIDATED',
                  'commit':'6d8f0b34fedac6e2400375631e22356d10da8aad',
                  'owner':'coordinator',
                  'reason':'PR #194 completed 5/5 CI checks'
              })
          with h.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=hfields,lineterminator='\n'); w.writeheader(); w.writerows(hrows)
          PY
      - name: Regenerate and validate canonical reports
        shell: bash
        run: |
          set -euo pipefail
          python tools/reports/report.py
          python tools/progress/treemap.py
          python tools/validate/validate.py
          git diff --check
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Reject binary-like content and commit promotion
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | awk '{print $2}' | grep -Ei '\.(exe|dll|obj)$'; then exit 31; fi
          rm -f .github/workflows/promote-004065a0.yml
          git add database/functions.csv database/history.csv reports .github/workflows/promote-004065a0.yml
          if git diff --cached --name-only | grep -Ei '\.(exe|dll|obj)$'; then exit 32; fi
          git diff --cached --check
          git commit -m 'Validate FUN_004065A0 fast-pass block [promote-004065a0]'
          git push origin HEAD:promote/004065a0-fastpass-valid
