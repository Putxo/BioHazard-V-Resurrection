name: Promote FUN_004067C0
on:
  push:
    branches: [promote/004067c0-fastpass-valid]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Promote metadata
        shell: python
        run: |
          from pathlib import Path
          import csv

          p=Path('database/functions.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          hdr=rows[0]; idx={k:i for i,k in enumerate(hdr)}
          matches=[r for r in rows[1:] if r[idx['stable_id']]=='FUN_004067C0']
          assert len(matches)==1
          r=matches[0]
          r[idx['fast_pass_validated']]='true'
          r[idx['pr']]='#237'
          r[idx['commit']]='6917f76e646a628bb0f37e8058a60dd809597bff'
          note=r[idx['notes']]
          suffix='PR #237 CI 5/5 PASS'
          if suffix not in note:
              r[idx['notes']]=note + ('; ' if note else '') + suffix
          with p.open('w', newline='') as f: csv.writer(f, lineterminator='\n').writerows(rows)

          p=Path('database/history.csv')
          with p.open(newline='') as f: rows=list(csv.reader(f))
          row=['FUN_004067C0','2026-09-22','FAST_PASS','FAST_PASS_VALIDATED',
               '6917f76e646a628bb0f37e8058a60dd809597bff','coordinator','PR #237 completed 5/5 CI checks']
          if row not in rows:
              rows.append(row)
          with p.open('w', newline='') as f: csv.writer(f, lineterminator='\n').writerows(rows)
      - name: Regenerate reports
        run: |
          python tools/reports/report.py
          python tools/progress/treemap.py
      - name: Validate
        run: python tools/validate/validate.py
      - name: Build and test
        run: |
          cmake --preset dev
          cmake --build --preset dev
          ctest --preset dev
      - name: Hygiene
        run: |
          git diff --check
          if git ls-files | grep -Ei '\.(exe|dll|obj)$' | grep -v '^$'; then exit 1; fi
          if find . -type f \( -name '*.exe' -o -name '*.dll' -o -name '*.obj' \) -not -path './build/*' -not -path './out/*' | grep .; then exit 1; fi
      - name: Commit promotion and remove helper
        run: |
          rm .github/workflows/promote-004067c0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database/functions.csv database/history.csv reports/functions.json reports/progress-treemap.svg reports/progress.md
          git add -u .github/workflows/promote-004067c0.yml
          git commit -m 'Validate FUN_004067C0 fast-pass block'
          git push
