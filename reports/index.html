<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioHazard V Resurrection — Progress Atlas</title><style>body{font-family:system-ui,sans-serif;margin:24px;background:#0b1020;color:#e5e7eb}input,select{padding:8px;margin:4px;background:#111827;color:#fff;border:1px solid #374151}object{width:100%;background:#fff;border-radius:8px}.legend span{display:inline-block;margin:4px 10px}.sw{width:14px;height:14px;display:inline-block;margin-right:4px;vertical-align:-2px}.card{background:#111827;padding:16px;border-radius:10px;margin:16px 0}</style></head><body><h1>BioHazard V Resurrection — Interactive Progress Atlas</h1><p>Generated from the canonical function database. Inventory-dependent values remain empty until real binary inventory exists.</p><div class="card legend"><span><i class="sw" style="background:#166534"></i>MATCHED</span><span><i class="sw" style="background:#22c55e"></i>VERIFIED</span><span><i class="sw" style="background:#86efac"></i>REFINED</span><span><i class="sw" style="background:#2dd4bf"></i>CONVERTED</span><span><i class="sw" style="background:#facc15"></i>FAST PASS</span><span><i class="sw" style="background:#ef4444"></i>BLOCKED</span><span><i class="sw" style="background:#fdba74"></i>DISCOVERED</span><span><i class="sw" style="background:#d1d5db"></i>UNSEEN</span></div><object data="progress-treemap.svg" type="image/svg+xml"></object><div class="card"><input id="q" placeholder="Search VA, ID or name"><select id="status"><option value="">All statuses</option><option>MATCHED</option><option>VERIFIED</option><option>REFINED</option><option>CONVERTED</option><option>FAST_PASS</option><option>BLOCKED</option></select><pre id="out">Inventory pending.</pre></div><script>fetch('functions.json').then(r=>r.json()).then(rows=>{const q=document.querySelector('#q'),s=document.querySelector('#status'),o=document.querySelector('#out');function tier(r){if(/true|1|yes/i.test(r.matched))return'MATCHED';if(/true|1|yes/i.test(r.verified))return'VERIFIED';if(/true|1|yes/i.test(r.refined))return'REFINED';if(/true|1|yes/i.test(r.converted))return'CONVERTED';if(/true|1|yes/i.test(r.fast_pass))return'FAST_PASS';return r.workflow_status||'UNSEEN'}function draw(){let x=q.value.toLowerCase(),st=s.value;let m=rows.filter(r=>(!x||JSON.stringify(r).toLowerCase().includes(x))&&(!st||tier(r)==st));o.textContent=m.slice(0,100).map(r=>`${r.stable_id} ${r.va} ${r.refined_name||r.provisional_name||''} ${tier(r)} ${r.size||'?'} bytes`).join('\n')||'No matching functions.'}q.oninput=draw;s.onchange=draw;draw()}).catch(()=>{});</script></body></html>
